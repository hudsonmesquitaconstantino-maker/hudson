<style>
:root{--bg:#FBF6F3;--card:#FFFFFF;--tx:#2D2330;--tx2:#7A6C78;--tx3:#ADA0AB;--line:#F1E6E9;--chip:#F6EEF0;
 --rose:#CF4377;--rose2:#FDE8F0;--lav:#7E66C2;--lav2:#F0EBFB;--mint:#23936D;--mint2:#E2F5EC;--coral:#D24B4B;--coral2:#FDEBEA;--gold:#B7801A;--gold2:#FBF1DC;
 --sh:0 1px 2px rgba(80,40,70,.05),0 8px 24px rgba(120,60,100,.07);--r:22px;
 --serif:'Fraunces',Georgia,'Times New Roman',serif;--sans:'Nunito',-apple-system,BlinkMacSystemFont,system-ui,sans-serif;color-scheme:light}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font:16px/1.4 var(--sans);-webkit-text-size-adjust:100%;overscroll-behavior:none}
/* moldura fixa: só o miolo rola, a barra de baixo fica presa (no iPhone a barra presa à janela afunda) */
body{position:fixed;inset:0;display:flex;flex-direction:column;overflow:hidden}
#rola{flex:0 1 auto;height:calc(100% - env(safe-area-inset-bottom) - 88px);min-height:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;overscroll-behavior:none;padding:calc(env(safe-area-inset-top) + 12px) 0 18px}
html.teclado #rola{height:100%}
header{padding:6px 20px 4px;display:flex;align-items:flex-end;justify-content:space-between;gap:10px}
h1{font:600 34px/1.05 var(--serif);letter-spacing:-.6px;margin:0}
.hd{font-size:13px;color:var(--tx2);text-align:right;line-height:1.3}
.ver{display:inline-block;margin-top:3px;padding:2px 8px;border-radius:999px;background:var(--chip);font-size:11.5px;font-weight:800;color:var(--tx2)}
main{padding:6px 16px 0}
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);padding:16px 18px;margin:0 0 14px}
h2{font:600 20px/1.2 var(--serif);margin:0 0 10px;letter-spacing:-.2px}
h3{font:600 24px/1.15 var(--serif);margin:0 0 4px;letter-spacing:-.3px}
.sub{font-size:13.5px;color:var(--tx2)}
.mut{color:var(--tx3)}
.pos{color:var(--mint)}.neg{color:var(--coral)}.lav{color:var(--lav)}.gold{color:var(--gold)}
.big{font:800 34px/1.1 var(--sans);letter-spacing:-.8px;font-variant-numeric:tabular-nums}
.kv{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:5px 0}
.kv b{font-variant-numeric:tabular-nums}
.hr{height:1px;background:var(--line);margin:10px 0}
/* herói */
.hero{border-radius:28px;padding:20px 20px 18px;margin:0 0 14px;color:#fff;background:linear-gradient(135deg,#E2709A 0%,#C25690 45%,#8F6CC9 100%);box-shadow:0 14px 34px rgba(190,80,140,.28);position:relative;overflow:hidden}
.hero:after{content:"";position:absolute;right:-60px;top:-70px;width:220px;height:220px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.28),rgba(255,255,255,0) 70%)}
.hero .lb{font-weight:700;font-size:14px;opacity:.92}
.hero .val{font:800 40px/1.05 var(--sans);letter-spacing:-1px;margin:4px 0 2px;font-variant-numeric:tabular-nums}
.hero .det{font-size:13px;opacity:.9}
.hero .strip{margin-top:14px;background:rgba(255,255,255,.18);border-radius:18px;padding:12px 14px;display:flex;gap:12px;align-items:center;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.hero .strip .ico{width:34px;height:34px;border-radius:12px;background:rgba(255,255,255,.28);display:flex;align-items:center;justify-content:center;font-size:17px;flex:none}
.hero .strip b{display:block;font-size:16.5px;line-height:1.25}
.hero .strip span{font-size:12.5px;opacity:.92}
.hero button{margin-top:12px;border:0;border-radius:14px;padding:12px 16px;font:800 15px var(--sans);background:#fff;color:var(--rose);width:100%}
/* linhas */
.row{display:flex;align-items:center;gap:12px;padding:11px 0;border-top:1px solid var(--line)}
.row:first-child,.dayh+.row,h2+.row,.cardH+.row{border-top:0}
.row .g{flex:1;min-width:0}
.row .t{font-weight:700;font-size:15.5px;line-height:1.25;overflow:hidden;text-overflow:ellipsis}
.row .s{font-size:12.8px;color:var(--tx2);margin-top:1px}
.row .v{font-weight:800;font-size:15.5px;white-space:nowrap;text-align:right;font-variant-numeric:tabular-nums}
.row .v small{display:block;font-weight:600;font-size:11.5px;color:var(--tx2)}
.tap{cursor:pointer}
.bub{width:40px;height:40px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:18px;flex:none;background:var(--chip)}
.bub.in{background:var(--mint2)}.bub.out{background:var(--rose2)}.bub.inc{background:var(--gold2)}.bub.lav{background:var(--lav2)}
.ck{width:30px;height:30px;border-radius:50%;border:2.4px solid currentColor;background:none;flex:none;padding:0;color:var(--mint)}
.ck.out{color:var(--rose)}.ck.on{background:var(--mint);border-color:var(--mint);color:#fff;font-weight:900;font-size:15px}
.pill{display:inline-block;font-size:11.5px;font-weight:800;padding:2px 9px;border-radius:999px;background:var(--chip);color:var(--tx2);vertical-align:1px}
.pill.ok{background:var(--mint2);color:var(--mint)}.pill.bad{background:var(--coral2);color:var(--coral)}.pill.inc{background:var(--gold2);color:var(--gold)}.pill.lav{background:var(--lav2);color:var(--lav)}.pill.rose{background:var(--rose2);color:var(--rose)}
.dayh{display:flex;justify-content:space-between;margin:14px 2px 2px;font-size:12.5px;font-weight:800;color:var(--tx2);text-transform:uppercase;letter-spacing:.4px}
.dayh:first-child{margin-top:0}.dayh.hoje{color:var(--rose)}
.empty{color:var(--tx2);font-size:14.5px;text-align:center;padding:14px 6px}
/* barras de categoria */
.catr{margin:8px 0}.catr .kv{padding:0}.cb{height:8px;border-radius:6px;background:var(--chip);overflow:hidden;margin-top:4px}.cb i{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,#E2709A,#9B7AD6)}
/* botões */
.btn{display:block;width:100%;border:0;border-radius:16px;padding:14px 16px;margin:8px 0 0;font:800 16px var(--sans);background:linear-gradient(135deg,#D95887,#B44F95);color:#fff;box-shadow:0 6px 16px rgba(190,70,130,.22)}
.btn.sec{background:var(--chip);color:var(--tx);box-shadow:none}
.btn.red{background:var(--coral2);color:var(--coral);box-shadow:none}
.btn.sm{display:inline-block;width:auto;padding:8px 14px;font-size:14px;margin:6px 6px 0 0}
.mnav{display:flex;align-items:center;justify-content:space-between;margin:0 0 12px}
.mnav b{font:600 20px var(--serif);text-transform:capitalize}
.mnav button{width:44px;height:40px;border-radius:14px;border:0;background:var(--card);box-shadow:var(--sh);font:800 20px var(--sans);color:var(--rose)}
.seg{display:flex;background:var(--chip);border-radius:16px;padding:4px;margin:0 0 12px;gap:2px}
.seg button{flex:1;border:0;background:none;border-radius:12px;padding:9px 4px;font:800 14px var(--sans);color:var(--tx2)}
.seg button.on{background:var(--card);color:var(--rose);box-shadow:0 2px 8px rgba(120,60,100,.1)}
.tri{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;text-align:center}
.tri span{display:block;font-size:12px;color:var(--tx2);font-weight:700}.tri b{font-size:16.5px;font-variant-numeric:tabular-nums}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chips button{border:0;border-radius:999px;padding:8px 13px;font:700 14px var(--sans);background:var(--chip);color:var(--tx)}
.chips button.on{background:var(--rose);color:#fff}
/* formulário */
.f{margin:12px 0 0}.f label{display:block;font-size:13px;font-weight:800;color:var(--tx2);margin:0 2px 6px}
.f input,.f select,.f textarea{width:100%;border:1.5px solid var(--line);border-radius:14px;padding:13px 14px;font:600 16px var(--sans);background:#fff;color:var(--tx);outline:none;-webkit-appearance:none;appearance:none}
.f input:focus,.f select:focus{border-color:#E7A6C0;box-shadow:0 0 0 4px rgba(207,67,119,.1)}
.f input.money{font:800 28px var(--sans);letter-spacing:-.5px;color:var(--tx)}
.f small{display:block;font-size:12.5px;color:var(--tx2);margin:6px 2px 0}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
/* barra de baixo (cápsula) e botão + */
#tabs{position:absolute;left:14px;right:90px;bottom:calc(env(safe-area-inset-bottom) + 10px);height:66px;display:grid;grid-template-columns:repeat(5,1fr);gap:2px;padding:6px;border-radius:33px;background:rgba(255,255,255,.82);-webkit-backdrop-filter:blur(22px) saturate(180%);backdrop-filter:blur(22px) saturate(180%);box-shadow:0 10px 30px rgba(110,50,90,.16);border:1px solid rgba(255,255,255,.9);z-index:20}
#tabs button{border:0;background:none;border-radius:27px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font:800 10.5px var(--sans);color:var(--tx3);padding:0}
#tabs button svg{width:23px;height:23px}
#tabs button.on{background:var(--rose2);color:var(--rose)}
#fab{position:absolute;right:14px;bottom:calc(env(safe-area-inset-bottom) + 10px);width:66px;height:66px;border-radius:50%;border:0;background:linear-gradient(135deg,#E2709A,#9B6BD0);color:#fff;font:600 34px/1 var(--sans);box-shadow:0 10px 26px rgba(170,70,140,.38);z-index:20}
html.teclado #tabs,html.teclado #fab{display:none}
/* janela de baixo */
#ov{position:absolute;inset:0;background:rgba(60,30,55,.32);display:none;z-index:40;align-items:flex-end;justify-content:center}
#ov.open{display:flex}
#sheet{background:var(--bg);width:100%;max-width:640px;max-height:calc(100% - 40px);overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;border-radius:28px 28px 0 0;padding:10px 18px calc(env(safe-area-inset-bottom) + 22px);animation:sobe .28s cubic-bezier(.32,.72,0,1)}
#sheet:before{content:"";display:block;width:42px;height:5px;border-radius:3px;background:#E2D5DA;margin:2px auto 12px}
@keyframes sobe{from{transform:translateY(40%);opacity:.4}to{transform:none;opacity:1}}
#toast{position:absolute;left:50%;bottom:calc(env(safe-area-inset-bottom) + 92px);transform:translate(-50%,20px);background:#3B2A3A;color:#fff;padding:11px 16px;border-radius:16px;font-weight:700;font-size:14px;opacity:0;pointer-events:none;transition:all .3s cubic-bezier(.32,.72,0,1);z-index:60;max-width:92%;text-align:center}
#toast.on{opacity:1;transform:translate(-50%,0);pointer-events:auto}
#toast button{margin-left:8px;border:0;border-radius:10px;padding:5px 10px;font:800 13px var(--sans);background:#fff;color:#3B2A3A}
.nuvem{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:800;color:var(--tx2)}
.nuvem i{width:8px;height:8px;border-radius:50%;background:var(--tx3);display:inline-block}
.nuvem.ok i{background:#3CC48D}.nuvem.err i{background:var(--coral)}.nuvem.sync i{background:var(--gold)}
.passo{display:flex;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.passo:first-of-type{border-top:0}
.passo .n{width:30px;height:30px;border-radius:50%;background:var(--rose2);color:var(--rose);display:flex;align-items:center;justify-content:center;font-weight:900;flex:none}
.passo.feito .n{background:var(--mint);color:#fff}
</style>
</head>

 <header><div><div class="sub" id="ola" style="font-weight:700"></div><h1 id="ttl">Início</h1></div><div class="hd"><div id="hdData"></div><span class="ver" id="ver" onclick="checaVersao(true)"></span></div></header>

<script>
'use strict';
/* =====================================================================
   Namorada — finanças pessoais (v1, 13/11/2026). Feito do zero a partir do Financeiro do Hudson,
   reformulado para quem recebe de clientes: cliente fixo todo mês, trabalhos/freelas com data
   combinada (às vezes pagos em partes) e Pix avulsos. Os dados ficam no aparelho e, com a chave,
   na nuvem protegida — o código não tem nenhum dado pessoal.
   ===================================================================== */
var APP_VER=5,APP_DATE='13/11/2026',KEY='nam_estado_v1',KEYK='nam_chave';
var FB_CFG={apiKey:"AIzaSyCOFRrTkOF0s3fs4-43IyO1NNVpBscRquw",authDomain:"guimas-73e01.firebaseapp.com",databaseURL:"https://guimas-73e01-default-rtdb.firebaseio.com",projectId:"guimas-73e01"};

/* ---------- utilidades ---------- */
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,8)}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function pad(n){return (n<10?'0':'')+n}
function iso(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function hoje(){return window.__HOJE||iso(new Date())}
function pd(s){var p=String(s).split('-');return new Date(+p[0],+p[1]-1,+p[2])}
function addD(s,n){var d=pd(s);d.setDate(d.getDate()+n);return iso(d)}
function dim(y,m){return new Date(y,m,0).getDate()}
function ymOf(s){return String(s).slice(0,7)}
function addM(ym,n){var y=+ym.slice(0,4),m=+ym.slice(5,7)-1+n;y+=Math.floor(m/12);m=((m%12)+12)%12;return y+'-'+pad(m+1)}
function diaNoMes(ym,dia){var y=+ym.slice(0,4),m=+ym.slice(5,7);return ym+'-'+pad(Math.min(Math.max(1,+dia||1),dim(y,m)))}
var DS=['domingo','segunda','terça','quarta','quinta','sexta','sábado'];
var MESES=['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
function dsem(s){return DS[pd(s).getDay()]}
function dbr(s){return s?s.slice(8,10)+'/'+s.slice(5,7):'—'}
function dlab(s){return s?dbr(s)+' ('+dsem(s)+')':'sem data'}
function dcurto(s){return s?dsem(s).slice(0,3)+' '+dbr(s):'—'}
function mesNome(ym){return MESES[+ym.slice(5,7)-1]+' '+ym.slice(0,4)}
function cap(s){return String(s).replace(/^./,function(c){return c.toUpperCase()})}
function mesSo(ym){return MESES[+ym.slice(5,7)-1]}
function diffD(a,b){return Math.round((pd(b)-pd(a))/864e5)}
function quando(d){var n=diffD(hoje(),d);return n===0?'hoje':n===1?'amanhã':n===-1?'ontem':n<0?'há '+(-n)+' dias':'em '+n+' dias'}
function c2s(c){if(c==null)return '—';var n=Math.abs(c)/100;return (c<0?'−':'')+'R$ '+n.toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2})}
function c2in(c){return c==null?'':(c/100).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2})}
function parseBRL(t){t=String(t==null?'':t).replace(/[R$\s]/g,'');if(!t)return null;t=t.replace(/^[-−]/,'');
 if(t.indexOf(',')>=0)t=t.replace(/\./g,'').replace(',','.');else if(/^\d{1,3}(\.\d{3})+$/.test(t))t=t.replace(/\./g,'');var n=Number(t);return isFinite(n)?Math.round(n*100):null}
function soma(a,f){return a.reduce(function(s,x){return s+(f?f(x):x)},0)}
function val(id){var e=document.getElementById(id);return e?e.value:''}
function parcV(v,n,i){var b=Math.floor(v/n);return i===0?v-b*(n-1):b}

/* ---------- estado: cada coleção é um mapa {id: registro}; cada registro tem "at" (quando mudou) ----------
   Assim, no celular dela e no do Hudson, cada lançamento é sincronizado sozinho, sem um apagar o do outro. */
var COLS=['cfg','contas','cartoes','clientes','cliMes','receber','lanc','fixas','fixasMes','faturas','cats'];
function blank(){var o={};COLS.forEach(function(c){o[c]={}});return o}
function load(){try{var r=localStorage.getItem(KEY);if(r){var o=JSON.parse(r);COLS.forEach(function(c){if(!o[c]||typeof o[c]!=='object')o[c]={}});return o}}catch(e){}return blank()}
var S=load();
function salvaLocal(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){toast('⚠️ Não consegui salvar neste aparelho')}}
function lista(col){var m=S[col]||{};return Object.keys(m).map(function(k){return m[k]}).filter(function(x){return x&&!x.del})}
function reg(col,id){var o=(S[col]||{})[id];return o&&!o.del?o:null}
function put(col,o){if(!o.id)o.id=uid();o.at=Date.now();if(!o.criado)o.criado=o.at;S[col][o.id]=JSON.parse(JSON.stringify(o));salvaLocal();nuvemPut(col,S[col][o.id]);return S[col][o.id]}
function muda(col,id,p){var o=Object.assign({id:id},S[col][id]||{},p);return put(col,o)}
function apaga(col,id){if(S[col][id])muda(col,id,{del:true})}
function cfg(){return S.cfg.geral||{}}
function inicio(){return cfg().inicio||ymOf(hoje())}
function vazio(){return !lista('contas').length&&!lista('cartoes').length&&!lista('clientes').length&&!lista('lanc').length&&!lista('fixas').length&&!lista('receber').length}

/* ---------- categorias ---------- */
var CATS0=['Mercado','Alimentação','iFood e delivery','Beleza','Roupas e acessórios','Casa','Contas da casa','Transporte','Uber e 99','Saúde','Farmácia','Academia','Lazer','Presentes','Assinaturas','Trabalho','Cursos','Pet','Viagem','Juros e taxas','Outros'];
function cats(){var u=lista('cats').map(function(c){return c.nome}),b=CATS0.slice(),i=b.indexOf('Outros');return b.slice(0,i).concat(u.filter(function(n){return b.indexOf(n)<0}),b.slice(i))}

 [/sal[aã]o|unha|manicure|cabel|escova|sobrancel|depila|maquiag|make|cosm[eé]t|perfum|skincare|botic[aá]rio|natura|sephora|est[eé]tica|c[ií]lio/i,'Beleza'],[/roupa|vestido|blusa|cal[cç]a|sapato|t[eê]nis|bolsa|shein|renner|zara|c&a|riachuelo|acess[oó]rio|bijou|brinco/i,'Roupas e acessórios'],

/* ---------- contas (bancos) ---------- */
function contas(){return lista('contas').sort(function(a,b){return (a.criado||0)-(b.criado||0)})}
function cartoes(){return lista('cartoes').sort(function(a,b){return (a.criado||0)-(b.criado||0)})}
function ehCartao(id){return !!reg('cartoes',id)}
function nomeMeio(id){var c=reg('contas',id);if(c)return c.nome;var k=reg('cartoes',id);if(k)return 'cartão '+k.nome;return ''}
/* entra/sai de cada conta: entrada +; gasto (não cartão), pagamentos e transferência saindo −; transferência chegando + */
function efeito(l,cid){var v=l.valor||0;
 if(l.tipo==='transf')return l.meio===cid?-v:(l.dest===cid?v:0);
 if(l.meio!==cid)return 0;
 if(l.tipo==='entrada'||l.tipo==='ajuste')return v;
 if(l.tipo==='gasto'||l.tipo==='pagfatura'||l.tipo==='pagfixa')return -v;
 return 0}
function saldoConta(c){if(c.saldoIni==null)return null;var s=c.saldoIni;
 lista('lanc').forEach(function(l){if(l.fora)return;if(l.data>c.dataIni||(l.data===c.dataIni&&(l.criado||0)>(c.saldoAt||0)))s+=efeito(l,c.id)});return s}
function saldoTotal(){var cs=contas();if(!cs.length||cs.some(function(c){return c.saldoIni==null}))return null;return soma(cs,saldoConta)}

/* ---------- cartões e faturas ---------- */
function faturaDe(c,d){var dia=+d.slice(8,10),ym=d.slice(0,7),V=+c.vence||1,C=+c.fecha||0;
 if(C){var fe=dia>=C?addM(ym,1):ym;return V>C?fe:addM(fe,1)}var due=diaNoMes(ym,V);return due>d?ym:addM(ym,1)}
function fixaVigente(f,ym){return !(f.del||(f.inicio&&f.inicio>ym)||(f.fim&&ym>f.fim))}
function fixaMesO(f,ym){return S.fixasMes[f.id+'|'+ym]||{}}
function valorFixa(f,ym){var o=fixaMesO(f,ym);if(o.apagada&&!o.del)return 0;return o.valor!=null&&!o.del?o.valor:(f.valor||0)}
function itensFatura(cid,ym){var c=reg('cartoes',cid),out=[];if(!c)return out;
 lista('lanc').forEach(function(l){if(l.tipo!=='gasto'||l.meio!==cid)return;var n=Math.max(1,+l.parc||1),base=l.fat1||faturaDe(c,l.data);
  for(var i=0;i<n;i++)if(addM(base,i)===ym)out.push({kind:'lanc',l:l,v:l.vParc!=null?l.vParc:parcV(l.valor,n,i),i:i+1,n:n,data:l.data,nome:l.desc||l.cat||'Compra'})});
 lista('fixas').forEach(function(f){if(f.meio!==cid)return;for(var k=-2;k<=1;k++){var mm=addM(ym,k);if(!fixaVigente(f,mm)||fixaMesO(f,mm).apagada)continue;var dt=diaNoMes(mm,f.dia||1);
  if(faturaDe(c,dt)===ym)out.push({kind:'fixa',f:f,v:valorFixa(f,mm),data:dt,nome:f.nome})}});
 out.sort(function(a,b){return a.data<b.data?1:a.data>b.data?-1:0});return out}
function fatura(cid,ym){var k=cid+'|'+ym,f=S.faturas[k]&&!S.faturas[k].del?S.faturas[k]:{},its=itensFatura(cid,ym),c=reg('cartoes',cid)||{};
 var sm=soma(its,function(x){return x.v}),valor=f.banco!=null?f.banco:sm,pags=lista('lanc').filter(function(l){return l.tipo==='pagfatura'&&l.ref===k}),pago=soma(pags,function(l){return l.valor}),quit=!!f.quitada;
 if(quit)pago=Math.max(pago,valor);
 return {k:k,cid:cid,ym:ym,nome:c.nome||'?',vence:diaNoMes(ym,+c.vence||1),valor:valor,soma:sm,banco:f.banco,its:its,pags:pags,pago:pago,resta:Math.max(0,valor-pago),estimado:f.banco==null,quitada:quit}}
function limiteCartao(c){if(!c.limite)return null;var t=hoje(),uso=0;for(var i=-1;i<=24;i++){var x=fatura(c.id,addM(ymOf(t),i));if(x.vence<t)continue;uso+=Math.max(0,(i<=1?x.valor:soma(x.its.filter(function(z){return z.kind==='lanc'}),function(z){return z.v}))-x.pago)}return {limite:c.limite,uso:uso,disp:c.limite-uso}}

/* ---------- a receber: clientes fixos (todo mês) e trabalhos (uma vez) ---------- */
function clientes(){return lista('clientes').sort(function(a,b){return (a.dia||0)-(b.dia||0)})}
function cliVigente(c,ym){return !((c.inicio&&c.inicio>ym)||(c.fim&&ym>c.fim))}
function cliMesO(c,ym){var o=S.cliMes[c.id+'|'+ym];return o&&!o.del?o:{}}
function recebidos(ref){return lista('lanc').filter(function(l){return l.tipo==='entrada'&&l.ref===ref}).sort(function(a,b){return a.data<b.data?-1:1})}
function itemCliente(c,ym){var o=cliMesO(c,ym),ref='cli|'+c.id+'|'+ym,rs=recebidos(ref),rec=soma(rs,function(l){return l.valor}),v=o.valor!=null?o.valor:(c.valor||0),d=o.data||diaNoMes(ym,c.dia||1);
 return {kind:'cli',id:c.id,ym:ym,ref:ref,data:d,dataNormal:diaNoMes(ym,c.dia||1),sinal:1,valor:v,rec:rec,resta:Math.max(0,v-rec),pags:rs,titulo:c.nome,tag:'cliente fixo',cert:c.incerto?'incerta':'provavel',apagada:!!o.apagada,mudouValor:o.valor!=null}}
function itemReceber(r){var ref='rec|'+r.id,rs=recebidos(ref),rec=soma(rs,function(l){return l.valor});
 return {kind:'rec',id:r.id,ref:ref,data:r.data,sinal:1,valor:r.valor,rec:rec,resta:Math.max(0,r.valor-rec),pags:rs,titulo:r.nome,tag:r.desc||'trabalho',cert:r.incerto?'incerta':'provavel'}}
function itemFixa(f,ym){var o=fixaMesO(f,ym),ref='fixa|'+f.id+'|'+ym,rs=lista('lanc').filter(function(l){return l.tipo==='pagfixa'&&l.ref===ref}),pg=soma(rs,function(l){return l.valor}),v=valorFixa(f,ym),d=o.data||diaNoMes(ym,f.dia||1);
 return {kind:'fixa',id:f.id,ym:ym,ref:ref,data:d,dataNormal:diaNoMes(ym,f.dia||1),sinal:-1,valor:v,rec:pg,resta:Math.max(0,v-pg),pags:rs,titulo:f.nome,tag:'conta fixa',cert:'certo',apagada:!!o.apagada,cat:f.cat}}
function status(x){if(x.resta<=0)return 'pago';if(x.data<hoje())return 'atrasado';return 'pendente'}
/* tudo do mês: o que entra, o que sai e o que já aconteceu */
function itensMes(ym){var out=[];
 clientes().forEach(function(c){if(!cliVigente(c,ym))return;var x=itemCliente(c,ym);if(x.apagada&&!x.rec)return;if(x.valor<=0&&!x.rec)return;x.status=status(x);out.push(x)});
 lista('receber').forEach(function(r){if(ymOf(r.data)!==ym)return;var x=itemReceber(r);x.status=status(x);out.push(x)});
 lista('fixas').forEach(function(f){if(!fixaVigente(f,ym)||ehCartao(f.meio))return;var x=itemFixa(f,ym);if(x.apagada&&!x.rec)return;x.status=status(x);out.push(x)});
 cartoes().forEach(function(c){var x=fatura(c.id,ym);if(x.valor<=0&&!x.pago)return;out.push({kind:'fat',id:c.id,ym:ym,ref:x.k,data:x.vence,sinal:-1,valor:x.valor,rec:x.pago,resta:x.resta,pags:x.pags,titulo:'Fatura '+c.nome,tag:x.estimado?'estimada pelas compras':'fatura',cert:'certo',status:x.resta<=0?'pago':(x.vence<hoje()?'atrasado':'pendente')})});
 return out}

/* ---------- projeção: dinheiro dia a dia (conta só o que é provável entrar) ---------- */
function projecao(ate){var t=hoje(),ev=[],ini=inicio();if(ate<t)ate=t;
 for(var m=addM(ymOf(t),-2)<ini?ini:addM(ymOf(t),-2);m<=ymOf(ate);m=addM(m,1))itensMes(m).forEach(function(x){
  if(x.resta<=0||x.data>ate)return;
  if(x.data<t){if(x.sinal<0)ev.push(Object.assign({},x,{dia:t,atrasado:true}));return}
  ev.push(Object.assign({},x,{dia:x.data}))});
 ev.sort(function(a,b){return a.dia<b.dia?-1:a.dia>b.dia?1:b.sinal-a.sinal});
 var saldo=saldoTotal(),run=saldo==null?0:saldo,ent=0,inc=0,min=null,minDia=null,outs=[],porDia={};
 ev.forEach(function(x){(porDia[x.dia]=porDia[x.dia]||[]).push(x)});
 for(var d=t;d<=ate;d=addD(d,1)){(porDia[d]||[]).forEach(function(x){if(x.sinal>0){if(x.cert==='provavel'){run+=x.resta;ent+=x.resta}else inc+=x.resta}});
  (porDia[d]||[]).forEach(function(x){if(x.sinal<0){var antes=run;run-=x.resta;outs.push({x:x,dia:d,antes:antes,saldo:run,ent:ent,inc:inc})}});
  if(min==null||run<min){min=run;minDia=d}}
 return {t:t,ate:ate,saldo:saldo,fim:run,ent:ent,inc:inc,min:min,minDia:minDia,outs:outs,ev:ev}}

/* ---------- linhas ---------- */
function icItem(x){return x.kind==='cli'?'💼':x.kind==='rec'?'✨':x.kind==='fat'?'💳':x.kind==='fixa'?icCat(x.cat||''):'•'}
function ckItem(x){if(x.resta<=0)return '<button class="ck on" onclick="event.stopPropagation();abrirItem(\''+x.kind+'\',\''+x.id+'\',\''+(x.ym||'')+'\')">✓</button>';
 return '<button class="ck '+(x.sinal>0?'':'out')+'" aria-label="'+(x.sinal>0?'Recebi tudo hoje':'Paguei tudo hoje')+'" onclick="event.stopPropagation();rapido(\''+x.kind+'\',\''+x.id+'\',\''+(x.ym||'')+'\')"></button>'}
function linhaItem(x,quandoMostra){var st=status(x),sub=[];
 if(quandoMostra)sub.push(st==='atrasado'?'<span class="neg">'+(x.sinal>0?'atrasado':'venceu')+' · era '+dcurto(x.data)+'</span>':x.data===hoje()?'hoje':dcurto(x.data));
 sub.push(esc(x.tag));if(x.rec>0&&x.resta>0)sub.push('já '+(x.sinal>0?'recebeu':'pagou')+' '+c2s(x.rec));
 if(x.cert==='incerta'&&x.resta>0)sub.push('<span class="pill inc">incerto</span>');
 return '<div class="row tap" onclick="abrirItem(\''+x.kind+'\',\''+x.id+'\',\''+(x.ym||'')+'\')">'+ckItem(x)+'<div class="g"><div class="t">'+esc(x.titulo)+'</div><div class="s">'+sub.join(' · ')+'</div></div><div class="v '+(x.sinal>0?'pos':'')+'">'+(x.resta>0?c2s(x.resta):c2s(x.valor))+(x.resta<=0?'<small>'+(x.sinal>0?'recebido':'pago')+'</small>':'')+'</div></div>'}

 if(vazio())return boasVindas();
 var fimMes=diaNoMes(ymOf(t),31),p=projecao(fimMes),cs=contas();
 /* herói */

 else{h+='<div class="val">'+c2s(p.saldo)+'</div><div class="det">'+(cs.length>1?cs.map(function(c){return esc(c.nome)+' '+c2s(saldoConta(c))}).join(' · '):'em '+esc(cs[0].nome))+' · toque para corrigir</div>';
  var pos=p.fim>=0;h+='<div class="strip"><div class="ico">'+(pos?'✓':'!')+'</div><div><b>'+mesSo(ymOf(t)).replace(/^./,function(c){return c.toUpperCase()})+(pos?': '+c2s(p.fim)+' na conta no fim do mês':': faltam '+c2s(-p.fim)+' na conta no fim do mês')+'</b><span>'+(p.inc>0?'sem contar '+c2s(p.inc)+' incerto':'conta com o que é provável entrar até '+dcurto(fimMes))+'</span></div></div>'}
 h+='</div>';
 var ps=passos();if(!ps.todos&&!cfg().semGuia)h+='<div class="card"><div class="kv" style="padding:0 0 4px"><h2 style="margin:0">Vamos terminar de arrumar</h2><a class="sub tap" onclick="muda(\'cfg\',\'geral\',{semGuia:1});render()">ocultar</a></div>'+ps.h+'</div>';
 h+=balancoMes();
 /* aperto */
 if(p.saldo!=null){var p45=projecao(addD(t,45)),ap=p45.outs.filter(function(o){return o.saldo<0})[0];
  if(ap)h+='<div class="card" style="border:1.5px solid var(--coral2)"><div class="kv" style="padding:0"><div><div class="sub" style="font-weight:800;color:var(--coral)">Atenção: vai faltar dinheiro</div><div style="font-weight:800;font-size:16px;margin-top:2px">'+esc(ap.x.titulo)+'</div><div class="sub">'+dlab(ap.dia)+' · '+quando(ap.dia)+'</div></div><div style="text-align:right"><div class="sub">faltam</div><b class="neg" style="font-size:20px">'+c2s(-ap.saldo)+'</b></div></div>'+(ap.inc>0?'<div class="sub" style="margin-top:8px">Se o incerto até lá entrar ('+c2s(ap.inc)+'), '+(ap.saldo+ap.inc>=0?'dá e sobra '+c2s(ap.saldo+ap.inc):'ainda faltam '+c2s(-(ap.saldo+ap.inc)))+'.</div>':'')+'</div>'}
 /* a receber e a pagar (atrasados + próximos 10 dias) */
 var lim=addD(t,10),its=[];[addM(ymOf(t),-2),addM(ymOf(t),-1),ymOf(t),addM(ymOf(t),1)].forEach(function(ym){if(ym<inicio())return;its=its.concat(itensMes(ym))});
 var rec=its.filter(function(x){return x.sinal>0&&x.resta>0&&x.data<=lim}).sort(function(a,b){return a.data<b.data?-1:1}),pag=its.filter(function(x){return x.sinal<0&&x.resta>0&&x.data<=lim}).sort(function(a,b){return a.data<b.data?-1:1});
 h+='<div class="card"><h2>Para receber</h2>'+(rec.length?rec.map(function(x){return linhaItem(x,true)}).join(''):'<div class="empty">Nada para receber nos próximos 10 dias.</div>')+'<button class="btn sm sec" onclick="go(\'receber\')">Ver tudo a receber ›</button></div>';
 h+='<div class="card"><h2>Para pagar</h2>'+(pag.length?pag.map(function(x){return linhaItem(x,true)}).join(''):'<div class="empty">Nenhuma conta nos próximos 10 dias. 🌿</div>')+'</div>';
 h+=cardsGrupos()+cardClassificar();
 /* gastos do mês (resumo) */
 var g=gastosMes(ymOf(t));if(g.tot>0){var ks=Object.keys(g.cat).sort(function(a,b){return g.cat[b]-g.cat[a]}).slice(0,3);
  h+='<div class="card tap" onclick="go(\'gastos\')"><div class="kv" style="padding:0"><h2 style="margin:0">Gastos de '+mesSo(ymOf(t))+'</h2><b>'+c2s(g.tot)+'</b></div>'+ks.map(function(k){var pc=g.cat[k]/g.tot*100;return '<div class="catr"><div class="kv"><span>'+icCat(k)+' '+esc(k)+'</span><b>'+Math.round(pc)+'%</b></div><div class="cb"><i style="width:'+Math.max(3,pc)+'%"></i></div></div>'}).join('')+'<div class="sub" style="margin-top:6px">toque para ver tudo ›</div></div>'}
 if(!lista('cfg').length||!cfg().backupEm||Date.now()-cfg().backupEm>14*864e5){if(!nuvemChave())h+='<div class="card tap" onclick="go(\'mais\')" style="background:var(--lav2);box-shadow:none"><b class="lav">☁️ Guarde na nuvem</b><div class="sub" style="margin-top:3px">Hoje os dados estão só neste celular. Ative a nuvem em Mais para não perder nada.</div></div>'}

function fTxt(id,label,v,ph,help){return '<div class="f"><label>'+label+'</label><input id="'+id+'" value="'+esc(v||'')+'" placeholder="'+esc(ph||'')+'" autocomplete="off">'+(help?'<small>'+help+'</small>':'')+'</div>'}
function fNum(id,label,v,ph){return '<div class="f"><label>'+label+'</label><input id="'+id+'" inputmode="numeric" value="'+esc(v==null?'':v)+'" placeholder="'+esc(ph||'')+'"></div>'}
function fData(id,label,v){return '<div class="f"><label>'+label+'</label><input id="'+id+'" type="date" value="'+(v||'')+'"></div>'}
function fSel(id,label,opts,v,help){return '<div class="f"><label>'+label+'</label><select id="'+id+'">'+opts.map(function(o){return '<option value="'+esc(o[0])+'"'+(String(o[0])===String(v)?' selected':'')+'>'+esc(o[1])+'</option>'}).join('')+'</select>'+(help?'<small>'+help+'</small>':'')+'</div>'}
function maisOpcoes(inner,txt){var k='mo'+uid();return '<button class="btn sec" onclick="this.style.display=\'none\';document.getElementById(\''+k+'\').style.display=\'block\'">'+(txt||'Outro valor, data ou banco')+'</button><div id="'+k+'" style="display:none" class="card">'+inner+'</div>'}
function optContas(){return contas().map(function(c){return [c.id,c.nome]})}
function contaPadrao(){var u=cfg().ultConta;if(u&&reg('contas',u))return u;var cs=contas();return cs.length?cs[0].id:''}
function lembraConta(c){if(c&&c!==cfg().ultConta)muda('cfg','geral',{ultConta:c})}
function dinheiro(id,zeroOk){var v=parseBRL(val(id));if(v==null||v<0||(!zeroOk&&v===0)){toast('Digite o valor');return null}return v}

/* ---------- bancos ---------- */
function abrirConta(id){var c=id?reg('contas',id):null;
 abrir('<h3>'+(c?esc(c.nome):'Novo banco')+'</h3>'+fTxt('cNome','Nome',c?c.nome:'','Ex.: Nubank')+fMoney('cSaldo','Quanto tem agora nele',c?saldoConta(c):null,'Olhe no app do banco e digite o saldo de hoje.')+
  '<button class="btn" onclick="salvarConta('+(c?"'"+c.id+"'":'null')+')">Salvar</button>'+(c?'<button class="btn red" onclick="if(confirm(\'Apagar este banco?\')){apaga(\'contas\',\''+c.id+'\');fechar();render()}">Apagar banco</button>':'')+'<button class="btn sec" onclick="fechar()">Cancelar</button>')}
function salvarConta(id){var n=val('cNome').trim();if(!n){toast('Dê um nome');return}var s=parseBRL(val('cSaldo')),p={nome:n};
 if(s!=null){var c=id?reg('contas',id):null;if(!c||s!==saldoConta(c)){p.saldoIni=s;p.dataIni=hoje();p.saldoAt=Date.now()}}
 if(id)muda('contas',id,p);else put('contas',p);fechar();render();toast(id?'Banco salvo':'Banco criado')}
function abrirSaldo(){var cs=contas();if(!cs.length)return abrirConta();if(cs.length===1)return abrirConta(cs[0].id);
 abrir('<h3>Saldo de hoje</h3><div class="sub">Toque no banco para corrigir.</div><div class="card" style="margin-top:12px">'+cs.map(function(c){return '<div class="row tap" onclick="abrirConta(\''+c.id+'\')"><div class="bub lav">🏦</div><div class="g"><div class="t">'+esc(c.nome)+'</div></div><div class="v">'+c2s(saldoConta(c))+'</div></div>'}).join('')+'</div><button class="btn sec" onclick="fechar()">Fechar</button>')}

/* ---------- cartões ---------- */
function abrirCartao(id){var c=id?reg('cartoes',id):null,ci=c&&c.cor!=null?c.cor:(cartoes().length%CORES.length);
 abrir('<h3>'+(c?esc(c.nome):'Novo cartão')+'</h3>'+fTxt('kNome','Nome',c?c.nome:'','Ex.: Nubank')+'<div class="two">'+fNum('kFecha','Dia que fecha',c?c.fecha:'','ex.: 3')+fNum('kVence','Dia que vence',c?c.vence:'','ex.: 10')+'</div>'+
  fMoney('kLim','Limite (opcional)',c?c.limite:null)+'<div class="f"><label>Cor</label><div class="chips">'+CORES.map(function(g,i){return '<button onclick="window._kCor='+i+';[].forEach.call(this.parentNode.children,function(b){b.style.outline=\'\'});this.style.outline=\'3px solid var(--tx)\'" style="width:42px;height:30px;background:'+g+';'+(i===ci?'outline:3px solid var(--tx)':'')+'"></button>'}).join('')+'</div></div>'+
  '<button class="btn" onclick="salvarCartao('+(c?"'"+c.id+"'":'null')+')">Salvar</button>'+(c?'<button class="btn red" onclick="apagarCartao(\''+c.id+'\')">Apagar cartão</button>':'')+'<button class="btn sec" onclick="fechar()">Cancelar</button>');window._kCor=ci}
function salvarCartao(id){var n=val('kNome').trim();if(!n){toast('Dê um nome');return}var f=+val('kFecha')||0,v=+val('kVence')||0;if(!v||v>31){toast('Diga o dia que vence');return}
 var p={nome:n,fecha:f>0&&f<=31?f:0,vence:v,limite:parseBRL(val('kLim'))||0,cor:window._kCor};if(id)muda('cartoes',id,p);else put('cartoes',p);fechar();render();toast('Cartão salvo')}
function apagarCartao(id){if(lista('lanc').some(function(l){return l.meio===id})){toast('O cartão tem compras lançadas; não dá para apagar');return}if(!confirm('Apagar este cartão?'))return;apaga('cartoes',id);fechar();render()}

/* ---------- clientes fixos ---------- */
function abrirCliente(id){var c=id?reg('clientes',id):null;
 abrir('<h3>'+(c?esc(c.nome):'Cliente fixo')+'</h3><div class="sub">Quem te paga todo mês um valor combinado.</div>'+fTxt('clNome','Nome do cliente',c?c.nome:'','Ex.: Loja da Ana')+fMoney('clVal','Quanto paga por mês',c?c.valor:null)+
  '<div class="two">'+fNum('clDia','Dia que paga',c?c.dia:'','ex.: 10')+fTxt('clIni','Desde (mês)',c?c.inicio:ymOf(hoje()),'AAAA-MM')+'</div>'+(c?'':'<small class="sub" style="display:block;margin:6px 2px 0">Se o dia deste mês já passou, ele começa a contar no mês que vem.</small>')+
  '<div class="f"><label>Esse pagamento é</label><div class="chips" id="clInc" data-v="'+(c&&c.incerto?1:0)+'"><button class="'+(c&&c.incerto?'':'on')+'" onclick="chipUm(this,0)">Certo, sempre paga</button><button class="'+(c&&c.incerto?'on':'')+'" onclick="chipUm(this,1)">Incerto</button></div><small>Incerto aparece, mas não entra na conta de quanto vai sobrar.</small></div>'+
  '<button class="btn" onclick="salvarCliente('+(c?"'"+c.id+"'":'null')+')">Salvar</button>'+(c&&!c.fim?'<button class="btn sec" onclick="clienteParou(\''+c.id+'\')">Parou de ser cliente</button>':'')+(c?'<button class="btn red" onclick="if(confirm(\'Apagar este cliente e tudo dele?\')){apaga(\'clientes\',\''+c.id+'\');fechar();render()}">Apagar cliente</button>':'')+'<button class="btn sec" onclick="fechar()">Cancelar</button>')}
function chipUm(b,v){[].forEach.call(b.parentNode.children,function(x){x.classList.remove('on')});b.classList.add('on');b.parentNode.dataset.v=v}
function salvarCliente(id){var n=val('clNome').trim();if(!n){toast('Escreva o nome');return}var v=dinheiro('clVal');if(v==null)return;var d=+val('clDia')||0;if(!d||d>31){toast('Diga o dia que paga');return}
 var ini=/^\d{4}-\d{2}$/.test(val('clIni').trim())?val('clIni').trim():ymOf(hoje());if(!id&&ini===ymOf(hoje())&&d<+hoje().slice(8,10))ini=addM(ini,1);var p={nome:n,valor:v,dia:d,inicio:ini,incerto:document.getElementById('clInc').dataset.v==='1'};
 if(id)muda('clientes',id,p);else{put('clientes',p);if(!lista('cfg').length||!cfg().inicio)muda('cfg','geral',{inicio:ymOf(hoje())})}fechar();render();toast('Cliente salvo')}
function clienteParou(id){var c=reg('clientes',id);muda('clientes',id,{fim:ymOf(hoje())});fechar();render();toast(c.nome+': não entra mais a partir do mês que vem')}
function listaClientes(){abrir('<h3>Clientes fixos</h3><div class="card" style="margin-top:12px">'+clientes().map(function(c){return '<div class="row tap" onclick="abrirCliente(\''+c.id+'\')"><div class="bub in">💼</div><div class="g"><div class="t">'+esc(c.nome)+'</div><div class="s">todo dia '+c.dia+(c.fim?' · até '+mesNome(c.fim):'')+'</div></div><div class="v pos">'+c2s(c.valor)+'</div></div>'}).join('')+'</div><button class="btn sec" onclick="fechar()">Fechar</button>')}

/* ---------- contas fixas ---------- */
function fMes(id,label,v,help){return '<div class="f"><label>'+label+'</label><input id="'+id+'" type="month" value="'+esc(v||'')+'">'+(help?'<small>'+help+'</small>':'')+'</div>'}
function abrirFixa(id,grupo){var f=id?reg('fixas',id):null,meios=[['conta','Boleto, Pix ou débito']].concat(cartoes().map(function(c){return [c.id,'No cartão '+c.nome]}));
 abrir('<h3>'+(f?esc(f.nome):'Conta fixa')+'</h3><div class="sub">O que vence todo mês: aluguel, internet, academia, assinatura…</div>'+fTxt('xNome','Nome',f?f.nome:'','Ex.: Internet')+fMoney('xVal','Valor de sempre',f?f.valor:null,'Se mudar num mês, mude só aquele mês depois.')+
  '<div class="two">'+fNum('xDia','Dia que vence',f?f.dia:'','ex.: 10')+fSel('xCat','Categoria',cats().map(function(c){return [c,c]}),f?f.cat:'Contas da casa')+'</div>'+fSel('xMeio','Como paga',meios,f?(ehCartao(f.meio)?f.meio:'conta'):'conta','No cartão: entra dentro da fatura e não soma de novo.')+
  fTxt('xGrupo','É com alguém? (opcional)',f?f.grupo:(grupo||''),'Ex.: Mãe','Junta as contas com a mesma pessoa num cartão com o total — cada uma continua separada.')+
  '<div class="two">'+fMes('xIni','Começa em',f?f.inicio:'')+fMes('xFim','Última vez em',f?f.fim:'')+'</div><small class="sub" style="display:block;margin:6px 2px 0">“Última vez” vazio = não tem data para acabar. Começa vazio = '+(f?'como está':'este mês (ou o próximo, se o dia já passou)')+'.</small>'+
  '<button class="btn" onclick="salvarFixa('+(f?"'"+f.id+"'":'null')+')">Salvar</button>'+(f&&!f.fim?'<button class="btn sec" onclick="fixaCancelou(\''+f.id+'\')">Cancelei: não vem mais</button>':'')+(f?'<button class="btn red" onclick="if(confirm(\'Apagar esta conta fixa?\')){apaga(\'fixas\',\''+f.id+'\');fechar();render()}">Apagar</button>':'')+'<button class="btn sec" onclick="fechar()">Cancelar</button>')}
function salvarFixa(id){var n=val('xNome').trim();if(!n){toast('Dê um nome');return}var v=dinheiro('xVal');if(v==null)return;var d=+val('xDia')||0;if(!d||d>31){toast('Diga o dia que vence');return}
 var p={nome:n,valor:v,dia:d,cat:val('xCat'),meio:val('xMeio'),grupo:String(val('xGrupo')||'').replace(/\s+/g,' ').trim().slice(0,30)},ini=val('xIni'),fim=val('xFim');
 if(p.grupo)p.grupo=p.grupo.charAt(0).toUpperCase()+p.grupo.slice(1);
 if(/^\d{4}-\d{2}$/.test(ini))p.inicio=ini;if(/^\d{4}-\d{2}$/.test(fim))p.fim=fim;else p.fim=null;
 if(p.inicio&&p.fim&&p.fim<p.inicio){toast('A última vez é antes do começo');return}
 if(id)muda('fixas',id,p);else{if(!p.inicio)p.inicio=d<+hoje().slice(8,10)&&!ehCartao(p.meio)?addM(ymOf(hoje()),1):ymOf(hoje());put('fixas',p)}fechar();render();toast('Conta fixa salva')}
function fixaCancelou(id){var f=reg('fixas',id),ym=ymOf(hoje()),pago=itemFixa(f,ym).rec>0;muda('fixas',id,{fim:pago?ym:addM(ym,-1)});fechar();render();toast(f.nome+': não vem mais')}

/* ---------- a folha de cada item (receber ou pagar) ---------- */
function achaItem(kind,id,ym){if(kind==='cli'){var c=reg('clientes',id);return c?itemCliente(c,ym):null}if(kind==='rec'){var r=reg('receber',id);return r?itemReceber(r):null}if(kind==='fixa'){var f=reg('fixas',id);return f?itemFixa(f,ym):null}
 if(kind==='fat'){var x=fatura(id,ym);return {kind:'fat',id:id,ym:ym,ref:x.k,data:x.vence,sinal:-1,valor:x.valor,rec:x.pago,resta:x.resta,pags:x.pags,titulo:'Fatura '+x.nome}}return null}
var IT=null;
function abrirItem(kind,id,ym,modo){if(kind==='fat'&&!modo)return abrirFatura(id,ym);var x=achaItem(kind,id,ym);if(!x)return;IT={kind:kind,id:id,ym:ym||''};var rec=x.sinal>0;
 var h='<h3>'+esc(x.titulo)+'</h3><div class="sub">'+(kind==='cli'?'cliente fixo · '+mesNome(ym):kind==='rec'?esc(reg('receber',id).desc||'trabalho'):'conta fixa · '+mesNome(ym))+' · '+(x.dataNormal&&x.data!==x.dataNormal?'combinado para '+dlab(x.data):(rec?'para receber ':'vence ')+dlab(x.data))+'</div>';
 if(kind==='rec'&&reg('receber',id).incerto)h+='<div style="margin-top:6px"><span class="pill inc">incerto</span> <span class="sub">fora da conta até entrar</span></div>';
 h+='<div class="card" style="margin-top:12px"><div class="tri"><div><span>Total</span><b>'+c2s(x.valor)+'</b></div><div><span>'+(rec?'Recebido':'Pago')+'</span><b class="pos">'+c2s(x.rec)+'</b></div><div><span>Falta</span><b class="'+(x.resta>0?'neg':'pos')+'">'+c2s(x.resta)+'</b></div></div></div>';
 if(!modo){
  if(x.resta>0)h+=botoesPagar(kind,id,ym,x.resta,rec);else h+='<div class="card" style="background:var(--mint2);box-shadow:none;text-align:center"><b class="pos">'+(rec?'Recebido':'Pago')+' por completo ✓</b></div>';
  h+='<button class="btn sec" onclick="abrirItem(\''+kind+'\',\''+id+'\',\''+(ym||'')+'\',\'data\')">📅 Mudar a data</button><button class="btn sec" onclick="abrirItem(\''+kind+'\',\''+id+'\',\''+(ym||'')+'\',\'valor\')">Mudar o valor'+(kind==='rec'?'':' deste mês')+'</button>';
  if(kind==='rec')h+='<button class="btn sec" onclick="abrirReceber(\''+id+'\')">Editar nome, cliente ou incerto</button>';
  if(kind==='cli')h+='<button class="btn sec" onclick="abrirCliente(\''+id+'\')">Editar o cliente</button>';
  if(kind==='fixa')h+='<button class="btn sec" onclick="abrirFixa(\''+id+'\')">Editar a conta fixa</button>';
  if(x.resta>0)h+='<button class="btn red" onclick="abrirItem(\''+kind+'\',\''+id+'\',\''+(ym||'')+'\',\'apagar\')">🗑 '+(x.rec>0?'Apagar o que falta ('+c2s(x.resta)+')':kind==='rec'?(rec?'Apagar (não vai receber)':'Apagar'):'Apagar só deste mês')+'</button>';
  h+=listaPags(x.pags,rec)}
 else if(modo==='data'){h+=fData('iData',rec?'Nova data para receber':'Nova data para pagar',x.data)+'<small class="sub" style="display:block;margin:6px 2px 0">Só muda a data. Não mexe no valor nem no saldo.</small><button class="btn" onclick="salvaItemData()">Salvar nova data</button>'+(x.dataNormal&&x.data!==x.dataNormal?'<button class="btn sec" onclick="document.getElementById(\'iData\').value=\''+x.dataNormal+'\';salvaItemData()">Voltar para o dia normal ('+dcurto(x.dataNormal)+')</button>':'')}
 else if(modo==='valor'){h+=fMoney('iVal',kind==='rec'?'Valor total combinado':'Valor deste mês',x.valor)+'<button class="btn" onclick="salvaItemValor()">Salvar valor</button>'+(x.mudouValor?'<button class="btn sec" onclick="salvaItemValor(1)">Voltar ao valor de sempre</button>':'')}
 else if(modo==='apagar'){h+='<div class="card" style="background:var(--coral2);box-shadow:none"><b class="neg">'+(x.rec>0?'Apagar os '+c2s(x.resta)+' que faltam?':'Apagar '+(kind==='rec'?'este trabalho':'só o de '+mesNome(ym))+'?')+'</b><div class="sub" style="margin-top:6px">'+(x.rec>0?'O que já '+(rec?'entrou':'foi pago')+' fica registrado.':(rec?'Sai do "a receber" e das contas.':'Sai das contas do mês.')+(kind==='rec'?'':' Os outros meses continuam.'))+'</div></div><button class="btn red" onclick="salvaItemApagar()">🗑 Apagar</button>'}
 if(modo)h+='<button class="btn sec" onclick="abrirItem(\''+kind+'\',\''+id+'\',\''+(ym||'')+'\')">Voltar</button>';else h+='<button class="btn sec" onclick="fechar()">Fechar</button>';
 abrir(h)}
function botoesPagar(kind,id,ym,resta,rec){var c=contaPadrao();if(!c)return '<div class="card"><div class="sub">Cadastre um banco em Mais para marcar como '+(rec?'recebido':'pago')+'.</div></div>';
 return '<button class="btn" style="font-size:17px;padding:15px" onclick="rapido(\''+kind+'\',\''+id+'\',\''+(ym||'')+'\')">✓ '+(rec?'Recebi tudo':'Paguei tudo')+' · '+c2s(resta)+'</button><div class="sub" style="text-align:center;margin:6px 0 2px">hoje · '+(rec?'cai em ':'sai de ')+esc(reg('contas',c).nome)+'</div>'+
  maisOpcoes(fMoney('pVal',rec?'Quanto entrou':'Quanto pagou',resta,'Pode ser só uma parte — o resto continua em aberto.')+fSel('pConta',rec?'Caiu em':'Saiu de',optContas(),c)+fData('pData','Data',hoje())+'<button class="btn" onclick="registra(\''+kind+'\',\''+id+'\',\''+(ym||'')+'\')">Registrar</button>',rec?'Recebi só uma parte, outro dia ou outro banco':'Paguei só uma parte, outro dia ou outro banco')}
function listaPags(ps,rec){if(!ps.length)return '';return '<div class="card"><h2>'+(rec?'Já recebido':'Já pago')+'</h2>'+ps.map(function(l){return '<div class="row"><div class="ck on" style="display:flex;align-items:center;justify-content:center">✓</div><div class="g"><div class="t">'+c2s(l.valor)+'</div><div class="s">'+dlab(l.data)+' · '+esc(nomeMeio(l.meio))+'</div></div><button class="btn sm sec" style="margin:0" onclick="desfazer(\''+l.id+'\')">Desfazer</button></div>'}).join('')+'</div>'}
function desfazer(lid){if(!confirm('Desfazer este registro?'))return;apaga('lanc',lid);fechar();render();toast('Desfeito')}
function tipoPag(kind){return kind==='fat'?'pagfatura':kind==='fixa'?'pagfixa':'entrada'}
function rapido(kind,id,ym){var x=achaItem(kind,id,ym),c=contaPadrao();if(!x||x.resta<=0)return;if(!c){toast('Cadastre um banco em Mais');return}
 var l=put('lanc',{tipo:tipoPag(kind),ref:x.ref,valor:x.resta,meio:c,data:hoje(),desc:x.titulo});lembraConta(c);fechar();render();toast(x.titulo+': '+c2s(l.valor)+(x.sinal>0?' recebido 💖':' pago'),[['lanc',l.id]])}
function registra(kind,id,ym){var x=achaItem(kind,id,ym),v=dinheiro('pVal');if(v==null)return;var c=val('pConta'),d=val('pData')||hoje();
 var l=put('lanc',{tipo:tipoPag(kind),ref:x.ref,valor:v,meio:c,data:d,desc:x.titulo});lembraConta(c);fechar();render();toast(x.titulo+': '+c2s(v)+(x.sinal>0?' recebido':' pago')+(v<x.resta?' · falta '+c2s(x.resta-v):''),[['lanc',l.id]])}
function salvaItemData(){var d=val('iData');if(!/^\d{4}-\d{2}-\d{2}$/.test(d)){toast('Escolha a data');return}var k=IT.kind,x=achaItem(k,IT.id,IT.ym);
 if(k==='rec')muda('receber',IT.id,{data:d});else{var col=k==='cli'?'cliMes':'fixasMes',key=IT.id+'|'+IT.ym;muda(col,key,{data:d===x.dataNormal?null:d,del:false})}
 fechar();render();toast('Nova data: '+dlab(d))}
function salvaItemValor(volta){var k=IT.kind,x=achaItem(k,IT.id,IT.ym),v=volta?null:dinheiro('iVal');if(!volta&&v==null)return;
 if(k==='rec')muda('receber',IT.id,{valor:v});else{var col=k==='cli'?'cliMes':'fixasMes';muda(col,IT.id+'|'+IT.ym,{valor:v,del:false})}fechar();render();toast(volta?'Voltou ao valor de sempre':'Valor salvo')}
function salvaItemApagar(){var k=IT.kind,x=achaItem(k,IT.id,IT.ym);
 if(k==='rec'){if(x.rec>0)muda('receber',IT.id,{valor:x.rec});else apaga('receber',IT.id)}
 else{var col=k==='cli'?'cliMes':'fixasMes';muda(col,IT.id+'|'+IT.ym,x.rec>0?{valor:x.rec,del:false}:{apagada:true,del:false})}
 fechar();render();toast('Apagado')}

/* ---------- lançar ---------- */
var NL=null;
function lancar(tipo){if(!contas().length){toast('Primeiro cadastre seu banco');return abrirConta()}NL={tipo:tipo||'gasto',data:hoje(),meio:contaPadrao(),parc:1};formLanc()}
function abrirLanc(id){var l=reg('lanc',id);if(!l)return;

 fs.forEach(function(f){if(f.fim&&f.fim>r.fim)r.fim=f.fim;if(!f.fim)r.semFim++;
  var ate=f.fim||addM(ym,11);for(var m=ym,z=0;m<=ate&&z<120;m=addM(m,1),z++){if(!fixaVigente(f,m))continue;var x=itemFixa(f,m);if(x.apagada&&!x.rec)continue;
   if(m===ym){r.mes+=x.valor;r.pagoMes+=x.rec}if(f.fim)r.falta+=x.resta;r.meses[m]=(r.meses[m]||0)+x.resta}});return r}
function tituloGrupo(n){return /^m[ãa]e$/i.test(n)?'Com a mãe':'Com '+n}
function cardsGrupos(){return Object.keys(gruposFixas()).sort().map(function(n){var r=resumoGrupo(n),rm=r.mes-r.pagoMes;
 return '<div class="card tap" onclick="abrirGrupo(\''+esc(n).replace(/'/g,"\\'")+'\')"><div class="kv" style="padding:0"><h2 style="margin:0">🤍 '+esc(tituloGrupo(n))+'</h2><span class="mut" style="font-size:20px">›</span></div>'+
  '<div class="kv"><span>Este mês ('+mesSo(ymOf(hoje()))+')</span><b>'+c2s(r.mes)+'</b></div>'+(r.pagoMes?'<div class="kv"><span>Já pagou</span><b class="pos">'+c2s(r.pagoMes)+'</b></div><div class="kv"><span>Falta este mês</span><b class="'+(rm>0?'neg':'pos')+'">'+c2s(rm)+'</b></div>':'')+
  (r.falta?'<div class="kv"><span>Falta até terminar'+(r.fim?' ('+mesSo(r.fim).slice(0,3)+'/'+r.fim.slice(2,4)+')':'')+'</span><b>'+c2s(r.falta)+'</b></div>':'')+'<div class="sub">'+r.fs.length+' ite'+(r.fs.length>1?'ns':'m')+' separado'+(r.fs.length>1?'s':'')+(r.semFim?' · '+r.semFim+' sem data para acabar':'')+'</div></div>'}).join('')}
function abrirGrupo(n){var r=resumoGrupo(n),ym=ymOf(hoje());
 var h='<h3>🤍 '+esc(tituloGrupo(n))+'</h3><div class="sub">Cada conta separada. Toque numa para pagar, mudar a data ou o valor do mês.</div>';
 h+='<div class="card" style="margin-top:12px"><div class="tri"><div><span>Este mês</span><b>'+c2s(r.mes)+'</b></div><div><span>Pago</span><b class="pos">'+c2s(r.pagoMes)+'</b></div><div><span>Falta</span><b class="'+(r.mes-r.pagoMes>0?'neg':'pos')+'">'+c2s(r.mes-r.pagoMes)+'</b></div></div></div>';
 h+='<div class="card"><h2>'+cap(mesNome(ym))+'</h2>'+r.fs.map(function(f){if(!fixaVigente(f,ym))return '<div class="row tap" onclick="abrirFixa(\''+f.id+'\')"><div class="bub lav">🤍</div><div class="g"><div class="t">'+esc(f.nome)+'</div><div class="s">'+(f.inicio>ym?'começa em '+mesNome(f.inicio):'terminou em '+mesNome(f.fim))+'</div></div><div class="v">'+c2s(f.valor)+'</div></div>';
  var x=itemFixa(f,ym),rest=0;if(f.fim)for(var m=addM(ym,1);m<=f.fim;m=addM(m,1))if(fixaVigente(f,m))rest++;x.tag=f.fim?(rest?'depois deste, mais '+rest+(rest>1?' meses':' mês')+' · até '+mesSo(f.fim)+'/'+f.fim.slice(2,4):'último mês'):'sem data para acabar';return linhaItem(x,true)}).join('')+'</div>';
 var ms=Object.keys(r.meses).sort().filter(function(m){return m>ym&&r.meses[m]>0}).slice(0,12);
 if(ms.length)h+='<div class="card"><h2>Próximos meses</h2>'+ms.map(function(m){return '<div class="kv"><span style="text-transform:capitalize">'+mesNome(m)+'</span><b>'+c2s(r.meses[m])+'</b></div>'}).join('')+(r.falta?'<div class="hr"></div><div class="kv"><span><b>Falta no total</b></span><b>'+c2s(r.falta)+'</b></div>':'')+'</div>';
 abrir(h+'<button class="btn sec" onclick="abrirFixa(null,\''+esc(n).replace(/'/g,"\\'")+'\')">+ Outra conta '+esc(tituloGrupo(n).toLowerCase())+'</button><button class="btn sec" onclick="fechar()">Fechar</button>')}

function exportar(){var j=JSON.stringify({app:'namorada',v:APP_VER,em:new Date().toISOString(),dados:S}),nome='namorada-'+hoje()+'.json';
 try{var f=new File([j],nome,{type:'application/json'});if(navigator.canShare&&navigator.canShare({files:[f]})){navigator.share({files:[f],title:nome}).catch(function(){});muda('cfg','geral',{backupEm:Date.now()});return}}catch(e){}
 var a=document.createElement('a');a.href=URL.createObjectURL(new Blob([j],{type:'application/json'}));a.download=nome;document.body.appendChild(a);a.click();setTimeout(function(){a.remove()},500);muda('cfg','geral',{backupEm:Date.now()});toast('Cópia baixada')}
function importar(inp){var f=inp.files&&inp.files[0];if(!f)return;var rd=new FileReader();rd.onload=function(){try{var o=JSON.parse(rd.result),d=o.dados||o;if(!d||!d.lanc)throw 0;if(!confirm('Restaurar esta cópia? O que está no celular é juntado com ela (vale o mais novo de cada lançamento).'))return;
  COLS.forEach(function(c){var m=d[c]||{};Object.keys(m).forEach(function(id){var x=m[id];if(x&&(!S[c][id]||(x.at||0)>(S[c][id].at||0))){S[c][id]=x;nuvemPut(c,x)}})});salvaLocal();render();toast('Cópia restaurada')}catch(e){toast('Arquivo inválido')}inp.value=''};rd.readAsText(f)}

/* ---------- teclado: a barra de baixo some enquanto digita ---------- */
(function(){var R=document.documentElement;function campo(e){if(!e||!e.isConnected)return false;var t=e.tagName;return t==='TEXTAREA'||(t==='INPUT'&&!/^(button|submit|checkbox|radio|file|hidden|date|month|time|range|color)$/i.test(e.type||''))}
 function upd(){var on=campo(document.activeElement);if(on!==R.classList.contains('teclado'))R.classList.toggle('teclado',on)}window.__tecUpd=upd;document.addEventListener('focusin',upd,true);document.addEventListener('focusout',function(){setTimeout(upd,120)},true);document.addEventListener('touchend',function(){setTimeout(upd,60)},true);setInterval(upd,500)})();

/* ---------- balanço do mês (Hudson 14/11): quanto entra, quanto sai e quanto sobra — previsto do mês e o que já aconteceu ---------- */
function balanco(ym){var it=itensMes(ym),rec=0,inc=0,des=0,ent=0,sai=0;
 it.forEach(function(x){if(x.apagada&&!x.rec)return;if(x.sinal>0){if(x.cert==='incerta')inc+=Math.max(0,x.valor-x.rec);else rec+=x.valor;if(x.cert==='incerta')rec+=x.rec}else des+=x.valor});
 lista('lanc').forEach(function(l){if(ymOf(l.data)!==ym)return;
  if(l.tipo==='entrada'){ent+=l.valor||0;if(!l.ref)rec+=l.valor||0}
  else if(l.tipo==='gasto'){if(!ehCartao(l.meio)){sai+=l.valor||0;des+=l.valor||0}}
  else if(l.tipo==='pagfixa'||l.tipo==='pagfatura')sai+=l.valor||0});
 cartoes().forEach(function(c){var x=fatura(c.id,ym),pr=soma(x.pags,function(l){return l.valor});if(x.quitada&&x.vence<=hoje())sai+=Math.max(0,x.valor-pr)});
 return {rec:rec,inc:inc,des:des,luc:rec-des,ent:ent,sai:sai}}
function balancoMes(){var ym=ymOf(hoje()),b=balanco(ym);if(!b.rec&&!b.des&&!b.ent&&!b.sai)return '';var pos=b.luc>=0;
 return '<div class="card tap" onclick="abrirBalanco(\''+ym+'\')"><div class="kv" style="padding:0 0 8px"><h2 style="margin:0">'+cap(mesSo(ym))+' · balanço</h2><span class="sub">ver tudo ›</span></div>'+
  '<div class="tri"><div><span>Receitas</span><b class="pos">'+c2s(b.rec)+'</b></div><div><span>Despesas</span><b class="neg">'+c2s(b.des)+'</b></div><div><span>'+(pos?'Sobra':'Falta')+'</span><b class="'+(pos?'pos':'neg')+'">'+c2s(Math.abs(b.luc))+'</b></div></div>'+
  '<div class="sub" style="margin-top:10px;text-align:center">Até hoje: entrou <b class="pos">'+c2s(b.ent)+'</b> · saiu <b class="neg">'+c2s(b.sai)+'</b>'+(b.inc>0?' · + '+c2s(b.inc)+' incerto':'')+'</div></div>'}

function abrirBalanco(ym){var b=balanco(ym),it=itensMes(ym),t=hoje();
 function linha(n,d,v,st,cls,on){return '<div class="row'+(on?' tap" onclick="'+on:'')+'"><div class="g"><div class="t">'+esc(n)+'</div><div class="s">'+st+'</div></div><div class="v '+(cls||'')+'">'+c2s(v)+'</div></div>'}
 var R=[],D=[];
 it.forEach(function(x){if(x.apagada&&!x.rec)return;var pago=x.resta<=0,st=(pago?(x.sinal>0?'recebido':'pago'):(x.data<t?'<span class="neg">'+(x.sinal>0?'atrasado':'venceu')+' '+dcurto(x.data)+'</span>':(x.sinal>0?'para receber ':'vence ')+dcurto(x.data)+' · '+quando(x.data)))+(x.cert==='incerta'&&!pago?' · incerto':'')+(x.rec>0&&!pago?' · já '+(x.sinal>0?'recebeu ':'pagou ')+c2s(x.rec):'');
  var on="abrirItem('"+x.kind+"','"+x.id+"','"+(x.ym||'')+"')";(x.sinal>0?R:D).push({d:x.data,h:linha(x.titulo,x.data,x.valor,st,x.sinal>0?'pos':'',on)})});
 var avs=lista('lanc').filter(function(l){return l.tipo==='entrada'&&!l.ref&&ymOf(l.data)===ym});avs.forEach(function(l){R.push({d:l.data,h:linha(l.desc||'Entrada',l.data,l.valor,'recebido '+dcurto(l.data)+' · Pix avulso','pos',"abrirLanc('"+l.id+"')")})});
 var pix=lista('lanc').filter(function(l){return l.tipo==='gasto'&&!ehCartao(l.meio)&&ymOf(l.data)===ym}),pt=soma(pix,function(l){return l.valor});if(pt)D.push({d:ym+'-99',h:linha('Gastos no Pix/débito',null,pt,pix.length+' gasto'+(pix.length>1?'s':'')+' · veja em Gastos','',"fechar();go('gastos')")});
 R.sort(function(a,b){return a.d<b.d?-1:1});D.sort(function(a,b){return a.d<b.d?-1:1});
 var h='<h3>'+cap(mesNome(ym))+'</h3><div class="sub">Tudo o que entra e sai no mês — toque num item para pagar, receber ou mudar.</div>';
 h+='<div class="card" style="margin-top:12px"><div class="tri"><div><span>Receitas</span><b class="pos">'+c2s(b.rec)+'</b></div><div><span>Despesas</span><b class="neg">'+c2s(b.des)+'</b></div><div><span>'+(b.luc>=0?'Sobra':'Falta')+'</span><b class="'+(b.luc>=0?'pos':'neg')+'">'+c2s(Math.abs(b.luc))+'</b></div></div></div>';
 h+='<div class="card"><h2>💰 Receitas</h2>'+(R.length?R.map(function(o){return o.h}).join(''):'<div class="empty">Nenhuma receita neste mês.</div>')+'</div>';
 h+='<div class="card"><h2>🧾 Despesas</h2>'+(D.length?D.map(function(o){return o.h}).join(''):'<div class="empty">Nenhuma despesa neste mês.</div>')+'<div class="sub" style="margin-top:8px">Cartão entra pelo valor da fatura que vence no mês (as compras ficam dentro dela).</div></div>';
 abrir(h+'<button class="btn sec" onclick="fechar()">Fechar</button>')}

<script>
var PIX_CFG={sel:'input.money'};
/* ===================== VALOR EM REAIS IGUAL AO PIX DO BANCO (Hudson 30/10/2026) =====================
   Nos campos de dinheiro você só digita os números; os dois últimos viram os centavos e o ponto de milhar
   entra sozinho: 1 → 0,01 · 10018 → 100,18 · 150000 → 1.500,00. Apagar tira o último número.
   - Vírgula e ponto digitados por costume são ignorados ("50,00" continua dando 50,00).
   - Colar um valor ("R$ 1.234,56" ou "1234") entende o valor do jeito de sempre.
   - Ao tocar num campo que já tem valor, ele aparece completo (ex.: "120" vira "120,00") para continuar daí.
   - Onde existe valor negativo (desconto), o sinal de menos liga/desliga o negativo.
   Só muda a DIGITAÇÃO: o valor que o app guarda é o mesmo de antes. */
(function(){
 if(window._pixMoeda)return;window._pixMoeda=1;
 var CFG=window.PIX_CFG||{};var SEL=CFG.sel||'input[inputmode="decimal"]',NEG=CFG.neg||'';
 function eh(el){try{return !!el&&el.tagName==='INPUT'&&!el.readOnly&&!el.disabled&&el.type!=='date'&&el.matches(SEL)}catch(e){return false}}
 function podeNeg(el){try{return !!NEG&&el.matches(NEG)}catch(e){return false}}
 function fmt(dg){dg=String(dg).replace(/^0+/,'');while(dg.length<3)dg='0'+dg;var i=dg.slice(0,-2).replace(/\B(?=(\d{3})+(?!\d))/g,'.');return i+','+dg.slice(-2)}
 /* valor escrito do jeito antigo ("120", "1.700", "550.50", "R$ 1.234,56") -> centavos */
 function centavos(v){var s=String(v||'').replace(/R\$\s?/gi,'').replace(/\s/g,'').replace(/-/g,'');if(!/\d/.test(s))return null;
  if(s.indexOf(',')>=0)s=s.replace(/\./g,'').replace(',','.');else if(/^\d{1,3}(\.\d{3})+$/.test(s))s=s.replace(/\./g,'');
  var n=parseFloat(s.replace(/[^\d.]/g,''));return isFinite(n)?Math.round(n*100):null}
 function poe(el,nv){if(el.value===nv)return;el.value=nv;try{el.setSelectionRange(nv.length,nv.length)}catch(e){}}
 function normaliza(el){var v=el.value;if(!v||!/\d/.test(v))return;var c=centavos(v);if(c==null)return;var neg=podeNeg(el)&&/^\s*-/.test(v);poe(el,(neg?'-':'')+fmt(String(c)))}
 /* ao entrar no campo: mostra o valor completo (antes do app reagir ao foco) */
 document.addEventListener('focus',function(e){var el=e.target;if(eh(el))normaliza(el)},true);
 document.addEventListener('input',function(e){var el=e.target;if(!eh(el))return;var v=el.value,neg=podeNeg(el)&&((v.match(/-/g)||[]).length%2===1);
  if(e.inputType==='insertFromPaste'||e.inputType==='insertReplacementText'){var c=centavos(v);poe(el,c==null?'':(neg?'-':'')+fmt(String(c)));return}
  var dg=v.replace(/\D/g,'').replace(/^0+/,'');if(dg.length>11)dg=dg.slice(0,11);
  poe(el,dg?(neg?'-':'')+fmt(dg):(neg?'-':''))},true);
 /* teclado numérico nos campos de dinheiro que ainda abriam o teclado de letras */
 function teclado(r){try{[].forEach.call((r||document).querySelectorAll(SEL),function(el){if(!podeNeg(el)&&el.getAttribute('inputmode')!=='decimal')el.setAttribute('inputmode','decimal')})}catch(e){}}
 if(CFG.teclado){teclado();try{new MutationObserver(function(ms){for(var i=0;i<ms.length;i++)if(ms[i].addedNodes.length){teclado();return}}).observe(document.documentElement,{childList:true,subtree:true})}catch(e){}}
 window._pixFmt=fmt;window._pixCentavos=centavos;
})();


</script>
