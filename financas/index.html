<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">

<title>Financeiro</title>
<style>
:root{--bg:#F3F4F2;--card:#FFFFFF;--card2:#F7F8F6;--tx:#121513;--tx2:#5F6662;--tx3:#99A09B;--line:#E6E9E6;--acc:#14624D;--accB:#1D8063;--acc2:#E2F1EB;--red:#C23A30;--red2:#FCEBE9;--yel:#9A6100;--yel2:#FFF3D9;--grn:#1B7A43;--grn2:#E4F4EA;--blue:#2459B8;--blue2:#E8EFFB;--chip:#EEF0ED;--sh:0 1px 2px rgba(16,24,20,.04),0 6px 18px rgba(16,24,20,.05)}
@media (prefers-color-scheme:dark){:root{--bg:#0B0D0C;--card:#17191A;--card2:#1E2122;--tx:#F1F3F2;--tx2:#A4ABA7;--tx3:#6E7672;--line:#272B2A;--acc:#3FC59A;--accB:#2FA07D;--acc2:#11332A;--red:#FF6F64;--red2:#3A1714;--yel:#F7BE52;--yel2:#382A0B;--grn:#5BD487;--grn2:#12301D;--blue:#7DA8F6;--blue2:#14243F;--chip:#25292A;--sh:none}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;-webkit-text-size-adjust:100%}
body{padding:calc(env(safe-area-inset-top) + 14px) 0 calc(env(safe-area-inset-bottom) + 92px)}
header{padding:4px 16px 6px;display:flex;align-items:center;justify-content:space-between;gap:10px}
header h1{font-size:23px;line-height:1.15;margin:0;font-weight:750;letter-spacing:-.4px}
header .hd{font-size:13px;color:var(--tx2);text-align:right;line-height:1.2;display:flex;align-items:center;gap:8px;white-space:nowrap}
header .ver{font-size:11.5px;font-weight:700;padding:3px 8px;border-radius:999px;background:var(--chip);color:var(--tx2)}header .ver.nova{background:var(--acc);color:#fff}
main{padding:2px 14px 0}
.card{background:var(--card);border-radius:20px;padding:16px;margin:12px 0;box-shadow:var(--sh)}
.card h2{font-size:12.5px;font-weight:700;color:var(--tx2);text-transform:uppercase;letter-spacing:.5px;margin:0 0 10px;display:flex;justify-content:space-between;align-items:center}
.card h2 a{color:var(--acc);text-transform:none;letter-spacing:0;font-size:14px;font-weight:600;cursor:pointer}
.hero{background:linear-gradient(145deg,#0F5844,#1C8564 70%,#2A9A74);color:#fff;border-radius:24px;padding:18px 18px 16px;margin:10px 0 12px;box-shadow:0 10px 28px rgba(16,90,68,.28)}
@media (prefers-color-scheme:dark){.hero{background:linear-gradient(145deg,#0D3F31,#145E48 70%,#1B7258);box-shadow:none}}
.hero .lb{font-size:13px;font-weight:600;opacity:.85;letter-spacing:.2px}
.hero .val{font-size:40px;font-weight:780;letter-spacing:-1px;line-height:1.1;margin:4px 0 2px}
.hero .det{font-size:13px;opacity:.8}
.hero .strip{margin-top:14px;background:rgba(255,255,255,.14);border-radius:16px;padding:11px 13px;display:flex;align-items:center;gap:10px}
.hero .strip b{font-size:19px;font-weight:750;display:block;line-height:1.15}
.hero .strip span{font-size:12.5px;opacity:.88}
.hero .strip .ico{width:34px;height:34px;border-radius:11px;background:rgba(255,255,255,.18);display:flex;align-items:center;justify-content:center;font-size:18px;flex:none}
.hero input{width:100%;border:0;border-radius:14px;padding:12px 14px;font:700 24px -apple-system,system-ui,sans-serif;margin-top:10px;background:rgba(255,255,255,.95);color:#111}
.hero .hbtn{border:0;background:#fff;color:#0F5844;font:700 15px -apple-system,system-ui,sans-serif;border-radius:13px;padding:11px 14px;margin-top:8px;width:100%;cursor:pointer}
.qa{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 6px;margin:0 -14px;padding-left:14px;padding-right:14px;scrollbar-width:none}
.qa::-webkit-scrollbar{display:none}
.qa button{flex:none;border:0;background:var(--card);color:var(--tx);border-radius:14px;padding:10px 13px;font:600 14.5px -apple-system,system-ui,sans-serif;box-shadow:var(--sh);cursor:pointer;display:flex;align-items:center;gap:7px}
.qa button i{font-style:normal;font-size:17px}
.dec{border-radius:20px;background:var(--card);padding:15px 16px;margin:10px 0;box-shadow:var(--sh);cursor:pointer}
.dec .top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.dec .nm{font-size:16px;font-weight:650}
.dec .when{font-size:12.5px;color:var(--tx2);margin-top:1px}
.dec .amt{font-size:21px;font-weight:760;white-space:nowrap;letter-spacing:-.3px}
.eq{margin-top:11px;background:var(--card2);border-radius:14px;padding:9px 12px;font-size:14px}
.eq div{display:flex;justify-content:space-between;padding:2.5px 0;color:var(--tx2)}
.eq div b{color:var(--tx);font-weight:600;white-space:nowrap}
.eq .tot{border-top:.5px solid var(--line);margin-top:4px;padding-top:6px;color:var(--tx);font-weight:600}
.res{margin-top:10px;border-radius:13px;padding:10px 12px;font-size:15px;font-weight:650;display:flex;justify-content:space-between;align-items:center}
.res.ok{background:var(--grn2);color:var(--grn)} .res.bad{background:var(--red2);color:var(--red)}
.res small{font-weight:500;font-size:12.5px;opacity:.85;display:block}
.row{display:flex;align-items:center;gap:11px;padding:10px 0;border-top:.5px solid var(--line)}
.row:first-child,.dayh+.row{border-top:0}
.row .g{flex:1;min-width:0}
.row .t{font-size:15.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .s{font-size:12.5px;color:var(--tx2);margin-top:1px}
.row .v{font-size:15.5px;font-weight:650;white-space:nowrap;text-align:right}
.row .v small{display:block;font-weight:500;font-size:11.5px;color:var(--tx2);margin-top:1px}
.bub{width:36px;height:36px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:17px;flex:none;background:var(--chip)}
.bub.out{background:var(--red2)} .bub.in{background:var(--grn2)} .bub.card{background:var(--blue2)} .bub.inc{background:var(--yel2)} .bub.off{background:var(--chip);filter:grayscale(1);opacity:.6}
.tap{cursor:pointer}
.tap:active{opacity:.55}
.dayh{display:flex;justify-content:space-between;align-items:baseline;margin:16px 2px 4px;font-size:12.5px;font-weight:700;color:var(--tx2);text-transform:uppercase;letter-spacing:.4px}
.dayh:first-child{margin-top:2px}
.dayh .sd{font-weight:650;text-transform:none;letter-spacing:0;font-size:13px;color:var(--tx)}
.dayh .sd.neg{color:var(--red)}
.dayh.hoje{color:var(--acc)}
.pill{display:inline-block;font-size:11.5px;font-weight:650;padding:2px 8px;border-radius:999px;background:var(--chip);color:var(--tx2);vertical-align:1px}
.pill.ok{background:var(--grn2);color:var(--grn)} .pill.bad{background:var(--red2);color:var(--red)} .pill.inc{background:var(--yel2);color:var(--yel)} .pill.inf{background:var(--blue2);color:var(--blue)}
.muted{opacity:.5}
.neg{color:var(--red)} .pos{color:var(--grn)} .warnc{color:var(--yel)}
.alert{border-radius:16px;padding:12px 14px;margin:8px 0;font-size:14.5px;display:flex;gap:10px;align-items:flex-start}
.alert i{font-style:normal;font-size:17px;line-height:1.2}
.alert.bad{background:var(--red2);color:var(--red)} .alert.inc{background:var(--yel2);color:var(--yel)} .alert.inf{background:var(--blue2);color:var(--blue)} .alert.ok{background:var(--grn2);color:var(--grn)}
.btn{display:block;width:100%;border:0;border-radius:14px;padding:14px;font:650 16px -apple-system,system-ui,sans-serif;background:var(--acc);color:#fff;margin-top:10px;cursor:pointer}
@media (prefers-color-scheme:dark){.btn{color:#04150F}}
.btn.sec{background:var(--chip);color:var(--tx)}
.btn.red{background:var(--red2);color:var(--red)}
.btn.sm{display:inline-block;width:auto;padding:8px 13px;font-size:14px;margin:6px 6px 0 0;border-radius:12px}
.mnav{display:flex;align-items:center;justify-content:space-between;margin:8px 0 2px}
.mnav button{border:0;background:var(--card);color:var(--acc);font-size:21px;width:44px;height:40px;border-radius:13px;cursor:pointer;box-shadow:var(--sh)}
.mnav b{font-size:17.5px;font-weight:700}
.kv{display:flex;justify-content:space-between;gap:12px;padding:5px 0;font-size:15px}
.kv span:first-child{color:var(--tx2)}
.kv b{font-weight:650;white-space:nowrap;text-align:right}
.bar{height:10px;border-radius:6px;background:var(--chip);overflow:hidden;display:flex;margin:8px 0 4px}
.bar i{display:block;height:100%}
.legend{display:flex;gap:14px;font-size:12.5px;color:var(--tx2);flex-wrap:wrap}
.legend span::before{content:'';display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:5px;background:var(--c)}
.cc{border-radius:22px;padding:16px 17px;margin:12px 0;color:#fff;cursor:pointer;position:relative;overflow:hidden;box-shadow:0 8px 22px rgba(0,0,0,.14)}
.cc::after{content:'';position:absolute;right:-40px;top:-50px;width:170px;height:170px;border-radius:50%;background:rgba(255,255,255,.08)}
.cc .nm{font-size:15px;font-weight:700;opacity:.95}
.cc .due{font-size:12.5px;opacity:.85}
.cc .amt{font-size:31px;font-weight:780;letter-spacing:-.6px;margin:8px 0 2px}
.cc .sp{display:flex;justify-content:space-between;font-size:13px;opacity:.9;margin-top:4px;gap:8px}
.cc .pb{height:6px;border-radius:4px;background:rgba(255,255,255,.22);margin-top:10px;overflow:hidden}
.cc .pb i{display:block;height:100%;background:#fff}
.cc .tag{display:inline-block;font-size:11.5px;font-weight:700;background:rgba(255,255,255,.2);padding:2px 8px;border-radius:999px;margin-left:6px;vertical-align:2px}
.weeks{display:flex;gap:6px;margin:10px 0 4px}
.wk{flex:1;border-radius:12px;padding:7px 4px;text-align:center;font-size:12px;cursor:pointer;background:var(--chip);color:var(--tx2);line-height:1.25}
.wk b{display:block;font-size:13px;color:var(--tx);font-weight:650}
.wk.ok{background:var(--grn2);color:var(--grn)} .wk.ok b{color:var(--grn)}
.wk.bad{background:var(--red2);color:var(--red)} .wk.bad b{color:var(--red)}
.wk.inc{background:var(--yel2);color:var(--yel)} .wk.inc b{color:var(--yel)}
.wk.off{opacity:.45}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 0}
.tile{background:var(--card);border-radius:18px;padding:12px 13px;box-shadow:var(--sh);cursor:pointer}
.tile .nm{font-size:14.5px;font-weight:650}
.tile .st{font-size:12.5px;color:var(--tx2);margin-top:2px}
.tile .v{font-size:17px;font-weight:720;margin-top:8px}
.sub{font-size:13.5px;color:var(--tx2)}
.mid{font-size:20px;font-weight:720}
.big{font-size:30px;font-weight:760;letter-spacing:-.5px}
.ext{background:var(--card2);border-radius:14px;padding:10px 12px;margin-top:10px}
.ext h4{margin:0 0 4px;font-size:12.5px;color:var(--tx2);text-transform:uppercase;letter-spacing:.4px}
.ext .row{padding:7px 0}
nav#tabs{position:fixed;left:0;right:0;bottom:0;display:grid;grid-template-columns:repeat(6,1fr);background:var(--card);border-top:.5px solid var(--line);box-shadow:0 -4px 14px rgba(16,24,20,.06);padding:7px 4px calc(env(safe-area-inset-bottom) + 6px);z-index:20}
nav#tabs button{border:0;background:none;color:var(--tx3);font:650 10.5px -apple-system,system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;padding:3px 0}
nav#tabs button svg{width:24px;height:24px}
nav#tabs button.on{color:var(--acc)}
/* botão + dentro da barra, do mesmo tamanho e na mesma linha das outras abas (Hudson 02/11: estava torto, saltando para fora) */
nav#tabs #fab{color:var(--acc)}
nav#tabs #fab .plus{width:30px;height:24px;border-radius:9px;background:var(--acc);color:#fff;display:flex;align-items:center;justify-content:center}
@media (prefers-color-scheme:dark){nav#tabs #fab .plus{color:#04150F}}
nav#tabs #fab .plus svg{width:18px;height:18px}
nav#tabs #fab:active .plus{transform:scale(.92)}
#ov{position:fixed;left:0;right:0;top:var(--vvt,0px);height:var(--vvh,100%);background:rgba(0,0,0,.38);display:none;z-index:40;align-items:flex-end;touch-action:none;overscroll-behavior:contain}
#ov.open{display:flex}
#sheet{background:var(--bg);width:100%;max-height:calc(var(--vvh,100dvh) - 18px);overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;touch-action:pan-y;will-change:transform;border-radius:22px 22px 0 0;padding:10px 16px calc(env(safe-area-inset-bottom) + 18px);-webkit-overflow-scrolling:touch;animation:up .22s ease-out}
@keyframes up{from{transform:translateY(30px);opacity:.4}to{transform:none;opacity:1}}
#sheet .grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:2px auto 10px}
#sheet .grabArea{margin:-10px -16px 0;padding:10px 16px 2px;touch-action:none;cursor:grab}
html.ovOn,html.ovOn body{overflow:hidden!important;overscroll-behavior:none}
#sheet h3{font-size:21px;margin:4px 0 4px;letter-spacing:-.3px}
.f{margin:12px 0}
.f label{display:block;font-size:13px;font-weight:650;color:var(--tx2);margin:0 2px 6px}
.f input,.f select,.f textarea{width:100%;border:0;border-radius:13px;background:var(--card);color:var(--tx);padding:13px 14px;font:16px -apple-system,system-ui,sans-serif;-webkit-appearance:none;appearance:none;box-shadow:var(--sh)}
.f input.money{font-size:28px;font-weight:750;letter-spacing:-.4px}
.f small{display:block;font-size:12.5px;color:var(--tx2);margin:6px 2px 0;line-height:1.4}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chips button{border:0;border-radius:999px;padding:8px 13px;background:var(--card);color:var(--tx);font:550 14.5px -apple-system,system-ui,sans-serif;cursor:pointer;box-shadow:var(--sh)}
.chips button.on{background:var(--acc);color:#fff}
@media (prefers-color-scheme:dark){.chips button.on{color:#04150F}}
.card .chips button:not(.on){background:var(--chip);box-shadow:none}
@media (prefers-color-scheme:dark){button.okb{background:var(--acc);color:#04150F}}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.empty{color:var(--tx2);font-size:14.5px;padding:6px 0}
#toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 10px);transform:translateX(-50%) translateY(-130px);visibility:hidden;background:var(--tx);color:var(--bg);padding:11px 17px;border-radius:16px;font-size:14.5px;font-weight:650;transition:transform .25s;z-index:60;max-width:90vw;text-align:center}
button.okb{flex:0 0 auto;width:40px;height:40px;margin-left:8px;border:0;border-radius:50%;background:var(--grn);color:#fff;font-size:19px;font-weight:800;line-height:40px;padding:0;cursor:pointer}button.okb:active{transform:scale(.92)}
.cc .lim{margin-top:10px;padding-top:9px;border-top:1px solid rgba(255,255,255,.22)}.cc .lim b{font-size:16px}.cc .lb2{height:6px;border-radius:4px;background:rgba(255,255,255,.25);margin:6px 0 4px;overflow:hidden}.cc .lb2 i{display:block;height:100%;background:#fff;border-radius:4px}
.seg{display:flex;background:var(--chip);border-radius:13px;padding:3px;margin:10px 0 2px}.seg button{flex:1;border:0;background:none;color:var(--tx2);font:650 14.5px -apple-system,system-ui,sans-serif;padding:9px 4px;border-radius:10px;cursor:pointer}.seg button.on{background:var(--card);color:var(--tx);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.nlinfo{background:var(--chip);border-radius:12px;padding:9px 12px;font-size:13.5px;color:var(--tx2);margin:-2px 0 10px;line-height:1.5}.nlinfo b{color:var(--tx)}.nlinfo b.neg{color:var(--red)}
.tri{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.tri span{display:block;font-size:12.5px;color:var(--tx2)}.tri b{font-size:15.5px;white-space:nowrap;display:block}
.catr{margin:7px 0}.catr .kv{margin:0}.cb{height:6px;border-radius:4px;background:var(--chip);overflow:hidden;margin-top:3px}.cb i{display:block;height:100%;background:var(--acc);border-radius:4px}
.vm{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}.vmt{background:var(--card);border-radius:18px;padding:12px 14px;box-shadow:var(--sh);position:relative}.vmt small{display:block;font-size:12.5px;color:var(--tx2);padding-right:30px;white-space:nowrap}.vmt.wide small{padding-right:0}.vmt b{display:block;font-size:18px;margin-top:2px;white-space:nowrap}.vmt em{display:block;font-style:normal;font-size:12.5px;color:var(--tx2);margin-top:2px}.vmt .ic{position:absolute;right:12px;top:10px;width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:800}.vmt .ic.in{background:var(--grn2);color:var(--grn)}.vmt .ic.out{background:var(--red2);color:var(--red)}.vmt.wide{grid-column:1/3;display:flex;align-items:center;gap:12px}.vmt.wide .ic{position:static;background:var(--blue2)}.vmt.wide>div{flex:1}
#toast.on{visibility:visible;transform:translateX(-50%) translateY(0)}
.help{font-size:13.5px;color:var(--tx2);line-height:1.45}
.hr{height:.5px;background:var(--line);margin:8px 0}
</style>
</head>
<body>
<header><h1 id="ttl">Hoje</h1><div class="hd" id="hd"></div></header>
<main id="main"></main>
<nav id="tabs">
 <button data-t="hoje" onclick="go('hoje')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11.5 12 4l9 7.5"/><path d="M5.5 10v9.5h13V10"/></svg>Hoje</button>
 <button data-t="agenda" onclick="go('agenda')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5" width="17" height="15.5" rx="3"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>Agenda</button>
 <button id="fab" aria-label="Novo lançamento" onclick="novoLanc()"><span class="plus"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></span>Lançar</button>

<script>
'use strict';
/* =====================================================================
   Financeiro — app pessoal do Hudson (v1)
   Os dados ficam SÓ neste aparelho (localStorage + IndexedDB). O código não
   contém nenhum dado pessoal: tudo entra pelo app ou pelo arquivo de backup.
   ===================================================================== */
var VER_NOVA=0,APP_VER=22, APP_DATE='03/11/2026', KEY='finH_estado_v1';
var S=null, TAB='hoje', M=null, ML=null, PROJ_DIAS=30, AG='tudo';

/* ---------- utilidades ---------- */
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,8)}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function pad(n){return (n<10?'0':'')+n}
function iso(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function hoje(){return window.__HOJE||iso(new Date())}
function pd(s){var p=String(s).split('-');return new Date(+p[0],+p[1]-1,+p[2])}
function addD(s,n){var d=pd(s);d.setDate(d.getDate()+n);return iso(d)}
function dim(y,m){return new Date(y,m,0).getDate()}
function ymOf(s){return String(s).slice(0,7)}
function addM(ym,n){var y=+ym.slice(0,4),m=+ym.slice(5,7)-1+n;y+=Math.floor(m/12);m=((m%12)+12)%12;return y+'-'+pad(m+1)}
function diaNoMes(ym,dia){var y=+ym.slice(0,4),m=+ym.slice(5,7);return ym+'-'+pad(Math.min(Math.max(1,dia),dim(y,m)))}
var DS=['domingo','segunda','terça','quarta','quinta','sexta','sábado'];
var MESES=['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
function dsem(s){return DS[pd(s).getDay()]}
function dbr(s){return s?s.slice(8,10)+'/'+s.slice(5,7):'—'}
function dlab(s){return s?dbr(s)+' ('+dsem(s)+')':'sem data'}
function mesNome(ym){return MESES[+ym.slice(5,7)-1]+' '+ym.slice(0,4)}
function diffD(a,b){return Math.round((pd(b)-pd(a))/864e5)}
function c2s(c){if(c==null)return '—';var n=Math.abs(c)/100;return (c<0?'−':'')+'R$ '+n.toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2})}
function c2in(c){return c==null?'':(c/100).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2})}
function parseBRL(t){
 t=String(t==null?'':t).replace(/[R$\s]/g,'');if(!t)return null;var neg=/^[-−]/.test(t);t=t.replace(/^[-−]/,'');
 if(t.indexOf(',')>=0)t=t.replace(/\./g,'').replace(',','.');else if(/^\d{1,3}(\.\d{3})+$/.test(t))t=t.replace(/\./g,'');
 var n=Number(t);if(!isFinite(n))return null;n=Math.round(n*100);return neg?-n:n}
function soma(a,f){return a.reduce(function(s,x){return s+(f?f(x):x)},0)}
function viv(a){return (a||[]).filter(function(x){return x&&!x.del})}
function toastDesf(m,lids){var t=document.getElementById('toast');t.innerHTML=esc(m)+' <button onclick="desfazerRapido()" style="margin-left:8px;border:0;border-radius:10px;padding:5px 10px;font:inherit;font-size:13px;background:var(--bg);color:var(--tx)">Desfazer</button>';toast._undo=lids;t.classList.add('on');clearTimeout(toast._t);toast._t=setTimeout(function(){t.classList.remove('on');toast._undo=null},6000)}
function desfazerRapido(){var u=toast._undo;toast._undo=null;if(!u)return;(u.lanc||[]).forEach(function(id){var l=porId(S.lanc,id);if(l)editar(l,{del:true})});if(u.sem){if(u.sem.v===undefined)delete S.semanas[u.sem.k];else S.semanas[u.sem.k]=u.sem.v}save();render();var ov=document.getElementById('ov');if(ov.classList.contains('open')&&u.reabre)u.reabre();toast('Desfeito')}
function toast(m){var t=document.getElementById('toast');toast._undo=null;t.textContent=m;t.classList.add('on');clearTimeout(toast._t);toast._t=setTimeout(function(){t.classList.remove('on')},2600)}

/* ---------- estado ---------- */
function blank(){return {app:'financeiro-hudson',v:1,criadoEm:Date.now(),inicio:ymOf(hoje()),contas:[],cartoes:[],faturas:{},fixas:[],fixasMes:{},carros:[],rendas:[],lanc:[],avulsas:[],semanas:{},backupEm:0,at:0}}
function norm(s){var b=blank();if(!s||typeof s!=='object')return b;for(var k in b)if(s[k]===undefined||s[k]===null)s[k]=b[k];
 ['contas','cartoes','fixas','carros','rendas','lanc','avulsas'].forEach(function(k){if(!Array.isArray(s[k]))s[k]=[]});
 if(typeof s.faturas!=='object')s.faturas={};if(!s.semanas||typeof s.semanas!=='object')s.semanas={};if(typeof s.fixasMes!=='object')s.fixasMes={};return s}
function load(){try{var r=localStorage.getItem(KEY);if(r)return norm(JSON.parse(r))}catch(e){}return blank()}
function save(){S.at=Date.now();var j=JSON.stringify(S);try{localStorage.setItem(KEY,j)}catch(e){toast('⚠️ Não consegui salvar neste aparelho')}idbPut(j)}
/* cópia espelho no IndexedDB (se o iPhone limpar uma, a outra recupera) */
function idb(cb){try{var r=indexedDB.open('finH',1);r.onupgradeneeded=function(){r.result.createObjectStore('k')};r.onsuccess=function(){cb(r.result)};r.onerror=function(){}}catch(e){}}
function idbPut(j){idb(function(db){try{db.transaction('k','readwrite').objectStore('k').put(j,'estado')}catch(e){}})}
function idbGet(cb){idb(function(db){try{var q=db.transaction('k').objectStore('k').get('estado');q.onsuccess=function(){cb(q.result||null)}}catch(e){cb(null)}})}
function vazio(){return !S.contas.length&&!S.cartoes.length&&!S.fixas.length&&!S.carros.length&&!S.lanc.length}
/* edição com histórico: guarda o valor anterior de cada campo mudado */
function editar(o,patch){o.hist=o.hist||[];var prev={},mud=false;for(var k in patch){if(JSON.stringify(o[k])!==JSON.stringify(patch[k])){prev[k]=o[k]===undefined?null:o[k];mud=true}}
 if(!mud)return false;o.hist.push({at:Date.now(),prev:prev});if(o.hist.length>40)o.hist.shift();for(var k2 in patch)o[k2]=patch[k2];o.at=Date.now();return true}
function porId(arr,id){for(var i=0;i<arr.length;i++)if(arr[i].id===id)return arr[i];return null}
function conta(id){return porId(S.contas,id)}
function cartao(id){return porId(S.cartoes,id)}
function carro(id){return porId(S.carros,id)}
function renda(id){return porId(S.rendas,id)}
function fixa(id){return porId(S.fixas,id)}
function ehCartao(id){var c=cartao(id);return !!(c&&!c.del)}

/* ---------- cartões e faturas ---------- */
/* em qual fatura (mês do vencimento) cai uma compra feita na data d */
function faturaDe(c,d){
 var dia=+d.slice(8,10),ym=d.slice(0,7),V=+c.vence||1,C=+c.fecha||0;
 if(C){var fecham=dia>=C?addM(ym,1):ym;return V>C?fecham:addM(fecham,1)}
 var due=diaNoMes(ym,V);return due>d?ym:addM(ym,1); /* sem dia de fechamento: próximo vencimento depois da compra */
}
function parcV(v,n,i){var b=Math.floor(v/n);return i===0?v-b*(n-1):b}
/* conta fixa de um carro excluído no Gestão (vendido): vale até o mês em que saiu e depois some (Hudson 03/11: seguro do Fiesta paga dia 5 e acabou). Financiamento NÃO some sozinho: dívida continua até você encerrar. */
function fixaVigente(f,ym){if(f.del||(f.inicio&&f.inicio>ym)||(f.fim&&ym>f.fim))return false;if(f.carro&&f.cat!=='Financiamentos'&&!/financ/i.test(f.nome||'')){var c=carro(f.carro),ex=c&&excluidoEm(c);if(ex&&ym>ymOf(ex))return false}return true}
function valorFixa(f,ym){var o=S.fixasMes[f.id+'|'+ym];return o&&o.valor!=null?o.valor:(f.valor||0)}
function itensFatura(cid,ym){
 var c=cartao(cid),out=[];if(!c)return out;
 viv(S.lanc).forEach(function(l){if(l.tipo!=='gasto'||l.meio!==cid)return;var n=Math.max(1,+l.parc||1),base=faturaDe(c,l.data);
  /* compra que veio da fatura do banco: parcela parcIni cai na fatura l.fat, cada uma com o valor exato do banco */
  if(l.fat){var k0=Math.max(1,+l.parcIni||1);for(var q=k0;q<=n;q++)if(addM(l.fat,q-k0)===ym)out.push({kind:'lanc',l:l,v:l.vParc,i:q,n:n,pai:l.de==='pai',data:l.data,nome:l.desc||l.cat||'Compra'});return}
  for(var i=0;i<n;i++)if(addM(base,i)===ym)out.push({kind:'lanc',l:l,v:parcV(l.valor,n,i),i:i+1,n:n,pai:l.de==='pai',data:l.data,nome:l.desc||l.cat||'Compra'})});
 viv(S.fixas).forEach(function(f){if(f.meio!==cid)return;for(var k=-2;k<=1;k++){var mm=addM(ym,k);if(!fixaVigente(f,mm))continue;var dt=diaNoMes(mm,f.dia||1);
  if(faturaDe(c,dt)===ym)out.push({kind:'fixa',f:f,v:valorFixa(f,mm),pai:false,data:dt,nome:f.nome,mes:mm})}});
 out.sort(function(a,b){return a.data<b.data?-1:1});return out;
}
/* limite: o que ainda está preso no cartão = faturas não pagas (do início do app em diante), com todas as parcelas futuras;
   conta fixa no cartão só entra quando a cobrança já aconteceu (as futuras ainda não usam limite) */
function emUsoCartao(cid){var t=hoje(),tot=0;for(var i=0;i<40;i++){var ym=addM(S.inicio,i),x=fatura(cid,ym),f=S.faturas[x.k]||{};
  var v=f.banco!=null?f.banco:soma(x.its.filter(function(it){return it.kind==='lanc'||it.data<=t}),function(it){return it.v});tot+=Math.max(0,v-x.pago)}return tot}
function limiteCartao(c){if(!(c.limite>0))return null;var u=emUsoCartao(c.id);return {limite:c.limite,uso:u,disp:c.limite-u,pct:Math.min(100,Math.max(0,u/c.limite*100))}}
function fatura(cid,ym){
 var k=cid+'|'+ym,f=S.faturas[k]||{},its=itensFatura(cid,ym),c=cartao(cid);
 /* parte do pai (Hudson 03/11): cada compra dele entra arredondada em reais (até 50 centavos para baixo, acima de 50 para cima);
    valor da parte do pai informado à mão = compras antigas; compra nova marcada "do pai" soma por cima */
 var som=soma(its,function(x){return x.v}),paiIts=its.filter(function(x){return x.pai}),paiNovos=paiIts.filter(function(x){return !(x.l&&x.l.imp)});
 var somPai=soma(paiIts,function(x){return arredPai(x.v)}),somNovos=soma(paiNovos,function(x){return arredPai(x.v)});
 var valor=f.banco!=null?f.banco:som,pai=f.pai!=null?f.pai+somNovos:somPai;
 var pags=viv(S.lanc).filter(function(l){return l.tipo==='pagfatura'&&l.ref===k}),pago=soma(pags,function(l){return l.valor});
 var reembs=viv(S.lanc).filter(function(l){return l.tipo==='reembolso'&&l.ref===k}),reemb=soma(reembs,function(l){return l.valor});
 return {k:k,cid:cid,ym:ym,nome:c?c.nome:'?',vence:diaNoMes(ym,c?(+c.vence||1):1),valor:valor,pai:pai,sua:valor-pai,soma:som,its:its,
  informado:f.banco!=null||its.some(function(i){return i.kind==='lanc'&&i.l.imp}),naoId:f.banco!=null?f.banco-som:0,pago:pago,resta:Math.max(0,valor-pago),pags:pags,reemb:reemb,paiPend:Math.max(0,pai-reemb),paiBase:f.pai!=null?f.pai:null,paiNovos:paiNovos};
}
function arredPai(v){var c=((v%100)+100)%100,r=(v-c)/100;return (c>50?r+1:r)*100}
/* texto para mandar ao pai pelo WhatsApp: as compras dele nesta fatura e o total a devolver */
function textoPai(cid,ym){var x=fatura(cid,ym),L=['*'+x.nome+' · fatura de '+mesNome(ym).split(' ')[0]+'*','Vence '+dsem(x.vence)+' '+dbr(x.vence).slice(0,5),''];
 if(x.paiBase!=null)L.push('• Compras e parcelas anteriores: R$ '+(x.paiBase/100).toLocaleString('pt-BR'));
 (x.paiBase!=null?x.paiNovos:x.its.filter(function(i){return i.pai})).slice().sort(function(a,b){return a.data<b.data?-1:1}).forEach(function(i){L.push('• '+dbr(i.data).slice(0,5)+' '+(i.nome||'Compra')+(i.n>1?' ('+i.i+'/'+i.n+')':'')+': R$ '+(arredPai(i.v)/100).toLocaleString('pt-BR'))});
 L.push('','*Total: R$ '+(x.pai/100).toLocaleString('pt-BR')+'*');if(x.reemb>0)L.push('Já devolvido: R$ '+(x.reemb/100).toLocaleString('pt-BR',{minimumFractionDigits:0})+' · falta R$ '+(x.paiPend/100).toLocaleString('pt-BR'));
 return L.join('\n')}
function copiarPai(cid,ym){var t=textoPai(cid,ym);function ok(){toast('Copiado: é só colar no WhatsApp do seu pai')}
 try{navigator.clipboard.writeText(t).then(ok,function(){fb()})}catch(e){fb()}
 function fb(){var a=document.createElement('textarea');a.value=t;a.setAttribute('readonly','');a.style.position='fixed';a.style.opacity='0';document.body.appendChild(a);a.select();try{document.execCommand('copy');ok()}catch(e){toast('Não consegui copiar')}a.remove()}}
function aReceberPai(){var t=0;viv(S.cartoes).forEach(function(c){for(var i=-6;i<=6;i++){var ym=addM(ymOf(hoje()),i);if(ym<S.inicio&&!S.faturas[c.id+'|'+ym])continue;t+=fatura(c.id,ym).paiPend}});return t}

/* ---------- contas fixas, carros, rendas ---------- */
function fixaMes(f,ym){var k=f.id+'|'+ym,v=valorFixa(f,ym),pags=viv(S.lanc).filter(function(l){return l.tipo==='pagfixa'&&l.ref===k}),pago=soma(pags,function(l){return l.valor});
 return {k:k,f:f,ym:ym,due:diaNoMes(ym,f.dia||31),semData:!f.dia,valor:v,pago:pago,resta:Math.max(0,v-pago),pags:pags}}
function parado(car,d){return viv(car.paradas||[]).some(function(p){return (!p.ini||p.ini<=d)&&(!p.fim||d<=p.fim)})}
function paradaAberta(car){var a=viv(car.paradas||[]).filter(function(p){return !p.fim});return a.length?a[a.length-1]:null}
function semanasDoMes(ym,ds){var y=+ym.slice(0,4),m=+ym.slice(5,7),out=[];for(var d=1;d<=dim(y,m);d++){var s=ym+'-'+pad(d);if(pd(s).getDay()===ds)out.push(s)}return out}
function recebSemana(kind,id,sem){return viv(S.lanc).filter(function(l){return l.tipo==='entrada'&&l.fonte===kind&&l.fid===id&&l.semana===sem})}

/* ---------- saldo das contas ---------- */
function sinal(l){switch(l.tipo){case 'entrada':case 'reembolso':case 'emprestimo':case 'recavulsa':case 'ajuste':return 1;
 case 'gasto':return ehCartao(l.meio)?0:-1;case 'pagfatura':case 'pagfixa':case 'pagavulsa':return -1;default:return 0}}
function saldoConta(c){if(c.saldoIni==null)return null;var s=c.saldoIni;
 viv(S.lanc).forEach(function(l){if(l.data<c.dataIni)return;if(l.data===c.dataIni&&(l.criado||0)<=(c.saldoAt||0))return;
  if(l.tipo==='transf'){if(l.meio===c.id)s-=l.valor;if(l.dest===c.id)s+=l.valor;return}if(l.meio!==c.id)return;s+=sinal(l)*l.valor});return s}
function saldoTotal(){var cs=viv(S.contas);if(!cs.length)return null;var t=0;for(var i=0;i<cs.length;i++){var v=saldoConta(cs[i]);if(v==null)return null;t+=v}return t}

/* ---------- tudo o que acontece num mês ---------- */
function itensMes(ym){
 var t=hoje(),out=[],atras=function(d){return d<t&&ym>=S.inicio};
 viv(S.fixas).forEach(function(f){if(!fixaVigente(f,ym)||ehCartao(f.meio))return;var x=fixaMes(f,ym);
  out.push({kind:'fixa',id:f.id,ym:ym,data:x.due,semData:x.semData,sinal:-1,valor:x.valor,resta:x.resta,cert:'certo',titulo:f.nome,status:x.resta<=0?'pago':(atras(x.due)?'atrasado':'pendente')})});
 viv(S.cartoes).forEach(function(c){var x=fatura(c.id,ym);if(x.valor<=0&&!x.informado)return;
  out.push({kind:'fatura',id:c.id,ym:ym,data:x.vence,sinal:-1,valor:x.valor,resta:x.resta,cert:x.informado?'certo':'estimado',titulo:'Fatura '+c.nome,status:x.resta<=0?'pago':(atras(x.vence)?'atrasado':'pendente'),pai:x.pai});
  if(x.pai>0)out.push({kind:'reemb',id:c.id,ym:ym,data:x.vence,sinal:1,valor:x.pai,resta:x.paiPend,cert:'provavel',titulo:'Reembolso do seu pai ('+c.nome+')',status:x.paiPend<=0?'pago':'pendente'})});
 viv(S.carros).forEach(function(car){var ug=usaGestao(car);if(!ug&&!(car.semanal>0))return;semanasDoMes(ym,car.diaSem==null?3:+car.diaSem).forEach(function(s){
  var ex=excluidoEm(car);if(ex&&s>=ex&&!recebSemana('carro',car.id,s).length)return;
  var k=contaSemana(car,s);if(!k)return;var inf=k.inf;
  var base={kind:'carro',id:car.id,sem:s,data:s,sinal:1,contrato:inf.contrato||inf.valor,titulo:car.nome,nota:(k.aj.valor!=null?'valor desta semana ajustado por você':inf.nota)||'',motorista:inf.motorista||'',devido:k.devido,pagoParc:k.pago,multaInfo:k};
  if(k.adiada){out.push(Object.assign(base,{valor:k.devido+k.carry,resta:0,cert:'certo',status:'adiado',nota:'não pagou · passou para '+dbr(k.adiada).slice(0,5)}));return}
  if(k.carry){var nC=Math.max(k.carryL.length,cadeiaSemana(car,s).filter(function(c){return c.W!==s}).length);base.nota=(base.nota?base.nota+' · ':'')+'inclui '+c2s(k.carry)+' de '+nC+' semana'+(nC>1?'s':'')+' anterior'+(nC>1?'es':'')}
  if(k.devido<=0&&!k.rs.length&&!k.carry){out.push(Object.assign(base,inf.status==='adiantado'?{valor:0,resta:0,cert:'certo',status:'adiantado'}:{valor:0,resta:0,cert:'certo',status:'parado',semContrato:inf.status==='semContrato'}));return}
  if(k.restaSem+k.carry<=0)out.push(Object.assign(base,{valor:Math.min(k.rec,Math.max(0,k.devido-k.abat))||k.rec,resta:0,cert:'certo',status:'pago'}));
  else out.push(Object.assign(base,{valor:k.devido+k.carry,resta:k.restaSem+k.carry,cert:certCarro(car,inf,s),status:atras(s)?'atrasado':'pendente',parcial:k.pago>0}));
  if(k.multa>0)out.push({kind:'multa',id:car.id,sem:s,data:addD(s,Math.max(0,k.dias-1)),sinal:1,valor:k.multa,resta:k.restaMulta,cert:'incerta',titulo:car.nome+' · multa',nota:k.dias+' dia'+(k.dias>1?'s':'')+' × '+c2s(k.md),status:k.restaMulta<=0?'pago':(addD(s,4)<t?'atrasado':'pendente')})})});
 viv(S.rendas).forEach(function(r){if(!(r.valor>0))return;if(r.inicio&&r.inicio>ym)return;semanasDoMes(ym,r.diaSem==null?3:+r.diaSem).forEach(function(s){
  var rs=recebSemana('renda',r.id,s),rec=soma(rs,function(l){return l.valor});
  out.push(rs.length?{kind:'renda',id:r.id,sem:s,data:s,sinal:1,valor:rec,resta:0,cert:'certo',titulo:r.nome,status:'pago'}
   :{kind:'renda',id:r.id,sem:s,data:s,sinal:1,valor:r.valor,resta:r.valor,cert:r.incerto?'incerta':'provavel',titulo:r.nome,status:atras(s)?'atrasado':'pendente'})})});
 viv(S.avulsas).forEach(function(a){if(ymOf(a.data)!==ym)return;var pags=viv(S.lanc).filter(function(l){return (l.tipo==='pagavulsa'||l.tipo==='recavulsa')&&l.ref===a.id}),pg=soma(pags,function(l){return l.valor});
  out.push({kind:'avulsa',id:a.id,data:a.data,sinal:a.receber?1:-1,valor:a.valor,resta:Math.max(0,a.valor-pg),cert:a.receber?(a.incerto?'incerta':'provavel'):'certo',titulo:a.desc,status:a.valor-pg<=0?'pago':(atras(a.data)?'atrasado':'pendente')})});
 /* movimentos já feitos que não pertencem a nenhum item acima (gastos à vista, outras entradas, reembolsos, empréstimos) */
 viv(S.lanc).forEach(function(l){if(ymOf(l.data)!==ym)return;
  if(l.tipo==='gasto'&&!ehCartao(l.meio))out.push({kind:'lanc',id:l.id,data:l.data,sinal:-1,valor:l.valor,resta:0,cert:'certo',titulo:l.desc||l.cat||'Gasto',status:'feito'});
  else if(l.tipo==='gasto')out.push({kind:'lanc',id:l.id,data:l.data,sinal:0,valor:l.valor,resta:0,cert:'certo',titulo:(l.desc||l.cat||'Compra')+' · '+(cartao(l.meio)||{}).nome,status:'cartao'});
  else if(l.tipo==='entrada'&&!l.fonte)out.push({kind:'lanc',id:l.id,data:l.data,sinal:1,valor:l.valor,resta:0,cert:'certo',titulo:l.desc||'Entrada',status:'feito'});
  else if(l.tipo==='emprestimo')out.push({kind:'lanc',id:l.id,data:l.data,sinal:1,valor:l.valor,resta:0,cert:'certo',titulo:(l.desc||'Empréstimo')+' (dívida)',status:'feito'});
  });
 viv(S.carros).forEach(function(car){docsPagosMes(car,ym).forEach(function(o,i){out.push({kind:'doc',id:car.id,data:o.pago,sinal:-1,valor:o.valor,resta:0,cert:'certo',titulo:o.nome+' · '+car.nome,nota:'pago no app Multas',status:'feito'})})});
 out.sort(function(a,b){return a.data<b.data?-1:a.data>b.data?1:(a.sinal-b.sinal)});

var TIPOS={gasto:'Gasto',entrada:'Entrada',reembolso:'Reembolso do pai',emprestimo:'Empréstimo / maquininha',transf:'Transferência',pagfatura:'Pagamento de fatura',pagfixa:'Pagamento de conta',pagavulsa:'Pagamento',recavulsa:'Recebimento',ajuste:'Ajuste de saldo'};
function descLanc(l){if(l.tipo==='entrada'&&l.fonte==='carro')return 'Semanal '+((carro(l.fid)||{}).nome||'')+' ('+dbr(l.semana)+')';if(l.tipo==='entrada'&&l.fonte==='renda')return ((renda(l.fid)||{}).nome||'Renda')+' ('+dbr(l.semana)+')';
 if(l.tipo==='pagfatura'){var p=l.ref.split('|');return 'Fatura '+((cartao(p[0])||{}).nome||'')+' '+mesNome(p[1])}if(l.tipo==='pagfixa'){var q=l.ref.split('|');return ((fixa(q[0])||{}).nome||'Conta')+' '+mesNome(q[1])}
 return (l.desc||l.cat||TIPOS[l.tipo]||'')+(l.tipo==='gasto'&&l.de==='pai'?' (do pai)':'')+(l.parc>1?' · '+l.parc+'x':'')}
function nomeMeio(l){var c=conta(l.meio)||cartao(l.meio);var s=c?c.nome:'—';if(l.tipo==='transf')s+=' → '+((conta(l.dest)||{}).nome||'');return TIPOS[l.tipo]+' · '+s}

/* ---------- folhas (formulários) ---------- */
/* janelas dentro de janelas (Hudson 03/11): abriu uma compra de dentro da fatura → "Voltar" e fechar levam de volta
   para a fatura, no mesmo ponto em que você estava, e não para a tela de Cartões. */
var PILHA=[];
function filho(fn,a,b){var sh=document.getElementById('sheet');PILHA.push({fn:function(){window[fn](a,b)},top:sh.scrollTop});if(PILHA.length>6)PILHA.shift()}
function abrir(h){var sh=document.getElementById('sheet'),ov=document.getElementById('ov');if(!ov.classList.contains('open'))PILHA=[];sh.style.transform='';sh.innerHTML='<div class="grabArea"><div class="grab"></div></div>'+h;if(!ov.classList.contains('open'))folhaTrava(true);ov.classList.add('open');sh.scrollTop=0;
 if(PILHA.length)[].forEach.call(sh.querySelectorAll('button.btn.sec'),function(b){if(/^(Fechar|Cancelar)$/.test(b.textContent.trim()))b.textContent='‹ Voltar'})}
function fecharTudo(){PILHA=[];fechar()}
function fechar(){var ov=document.getElementById('ov');if(!ov.classList.contains('open'))return;
 if(PILHA.length){var p=PILHA.pop(),sh0=document.getElementById('sheet');try{p.fn()}catch(e){PILHA=[];return fechar()}sh0.scrollTop=p.top;return}ov.classList.remove('open');var sh=document.getElementById('sheet');sh.innerHTML='';sh.style.transform='';folhaTrava(false)}
/* ---------- janela de baixo (lançar, editar…) firme no iPhone — Hudson 02/11/2026 ----------
   • a página de trás não rola nem "puxa" junto quando você arrasta dentro da janela;
   • rolar para cima e para baixo dentro da janela funciona em qualquer ponto, inclusive no começo e no fim;
   • com o teclado aberto, a janela fica na área visível (não some atrás do teclado) e o campo fica à vista;
   • arrastar a barrinha do topo para baixo fecha a janela. */
var _folhaY=0;
function folhaTrava(on){var b=document.body,de=document.documentElement;
 if(on){_folhaY=window.pageYOffset||de.scrollTop||0;de.classList.add('ovOn');b.style.position='fixed';b.style.top=(-_folhaY)+'px';b.style.left='0';b.style.right='0';b.style.width='100%'}
 else{de.classList.remove('ovOn');b.style.position='';b.style.top='';b.style.left='';b.style.right='';b.style.width='';window.scrollTo(0,_folhaY)}}
(function(){
 var ov=document.getElementById('ov'),sh=document.getElementById('sheet'),de=document.documentElement,vv=window.visualViewport;
 function medidas(){if(!vv)return;de.style.setProperty('--vvh',Math.round(vv.height)+'px');de.style.setProperty('--vvt',Math.round(vv.offsetTop)+'px')}
 if(vv){vv.addEventListener('resize',medidas);vv.addEventListener('scroll',medidas);medidas()}
 /* arrasto: dentro da janela só ela rola; fora dela (fundo escuro) nada rola */
 var y0=0,top0=0,puxa=false,dy=0;
 sh.addEventListener('touchstart',function(e){y0=e.touches[0].clientY;dy=0;puxa=!!(e.target.closest&&e.target.closest('.grabArea'));
  if(!puxa){var max=sh.scrollHeight-sh.clientHeight;if(max>0){if(sh.scrollTop<=0)sh.scrollTop=1;else if(sh.scrollTop>=max)sh.scrollTop=max-1}}},{passive:true});
 sh.addEventListener('touchmove',function(e){var y=e.touches[0].clientY;dy=y-y0;
  if(puxa){e.preventDefault();sh.style.transition='none';sh.style.transform='translateY('+Math.max(0,dy)+'px)';return}
  if(sh.scrollHeight<=sh.clientHeight+1)e.preventDefault()},{passive:false});
 sh.addEventListener('touchend',function(){if(!puxa)return;puxa=false;sh.style.transition='transform .2s ease-out';
  if(dy>110){sh.style.transform='translateY(100%)';setTimeout(function(){sh.style.transition='';fechar()},190)}else{sh.style.transform='';setTimeout(function(){sh.style.transition=''},210)}});
 ov.addEventListener('touchmove',function(e){if(!sh.contains(e.target))e.preventDefault()},{passive:false});
 /* campo tocado: fica à vista dentro da janela, acima do teclado */
 sh.addEventListener('focusin',function(e){var el=e.target;if(!el||!/^(INPUT|TEXTAREA|SELECT)$/.test(el.tagName))return;
  setTimeout(function(){try{var r=el.getBoundingClientRect(),s=sh.getBoundingClientRect(),alt=vv?vv.height:innerHeight;if(r.bottom>alt-20||r.top<s.top+8)sh.scrollTop+=r.top-s.top-Math.max(60,(Math.min(alt,s.bottom)-s.top)/3)}catch(x){}},320)});
})();

function salvarConta(id){var nome=val('cNome').trim();if(!nome){toast('Dê um nome');return}var v=parseBRL(val('cSaldo')),c=id?conta(id):null,t=hoje();
 if(!c){c={id:uid(),nome:nome,saldoIni:null,dataIni:null,saldoAt:0,criado:Date.now()};S.contas.push(c)}else editar(c,{nome:nome});
 if(v!=null){if(c.saldoIni==null)editar(c,{saldoIni:v,dataIni:t,saldoAt:Date.now()});else corrigeSaldo(c,v)}
 save();fechar();render();toast('Conta salva')}

function corrigeSaldo(c,v){var cur=saldoConta(c),t=hoje();if(cur==null||v===cur)return;var dif=v-cur,a=viv(S.lanc).filter(function(l){return l.tipo==='ajuste'&&l.meio===c.id&&l.data===t}).pop();
 if(a){var nv=a.valor+dif;editar(a,nv===0?{del:true}:{valor:nv})}else S.lanc.push({id:uid(),tipo:'ajuste',valor:dif,data:t,meio:c.id,desc:'Ajuste de saldo',criado:Date.now(),at:Date.now()})}
function abrirSaldo(){var cs=viv(S.contas);if(!cs.length)return abrirConta();
 abrir('<h3>Quanto tem agora?</h3><div class="sub">Olhe no app do banco e digite. O app acerta a diferença sozinho.</div>'+cs.map(function(c){var s=saldoConta(c);return fMoney('sd_'+c.id,esc(c.nome),s,s!=null?'O app calcula '+c2s(s):'')}).join('')+

 h+=maisOpcoes(fMoney('fBanco','Valor que o banco cobra',f.banco,'Deixe vazio para usar a soma dos itens lançados ('+c2s(x.soma)+').')+

 h+='<div class="card"><div class="kv"><span>Total</span><b>'+c2s(x.valor)+'</b></div><div class="kv"><span>Sua parte</span><b>'+c2s(x.sua)+'</b></div><div class="kv"><span>Pago</span><b>'+c2s(x.pago)+'</b></div><div class="kv"><span>Falta pagar</span><b class="'+(x.resta?'neg':'')+'">'+c2s(x.resta)+'</b></div>'+(x.pai?'<div class="kv"><span>Reembolso do pai recebido</span><b>'+c2s(x.reemb)+' de '+c2s(x.pai)+'</b></div>':'')+(x.informado?'<div class="kv"><span>Não identificado</span><b class="warnc">'+c2s(x.naoId)+'</b></div>':'')+'</div>'+(x.pai>0?'<button class="btn sec" onclick="copiarPai(\''+cid+'\',\''+ym+'\')">📋 Copiar a parte do pai ('+c2s(x.pai)+')</button>':'');
 x.pags.forEach(function(l){h+='<div class="row"><div class="g"><div class="t">Pago '+c2s(l.valor)+'</div><div class="s">'+dlab(l.data)+' · '+esc(nomeContaL(l))+'</div></div><button class="btn sm red" onclick="desfazer(\''+l.id+'\')">Desfazer</button></div>'});
 h+='<div class="card"><h2>Itens lançados ('+x.its.length+')</h2>';x.its.slice().sort(function(a,b){var da=a.data||'',db=b.data||'';if(da!==db)return da<db?1:-1;return ((b.l&&b.l.criado)||0)-((a.l&&a.l.criado)||0)}).forEach(function(i){h+='<div class="row tap" onclick="filho(\'abrirFatura\',\''+cid+'\',\''+ym+'\');'+(i.kind==='lanc'?"abrirLanc('"+i.l.id+"')":"abrirFixa('"+i.f.id+"')")+'"><div class="g"><div class="t">'+esc(i.nome)+(i.pai?' <span class="pill inf">pai</span>':'')+(i.n>1?' <span class="pill">'+i.i+'/'+i.n+'</span>':'')+'</div><div class="s">'+dlab(i.data)+(i.kind==='fixa'?' · conta fixa':'')+'</div></div><div class="v">'+c2s(i.v)+'</div></div>'});

 abrir(h+'</div><button class="btn sec" onclick="filho(\'abrirFatura\',\''+cid+'\',\''+ym+'\');abrirCartao(\''+cid+'\')">Dias de fechamento e vencimento</button><button class="btn sec" onclick="fechar()">Fechar</button>')}

function _mesAnt(d){return !!d&&ymOf(d)<ymOf(hoje())}
function blocoPagar(kind,id,ym,resta,venc,rotulo){if(!(resta>0))return '';var c=contaPadrao();if(!c)return '<p class="help">Cadastre uma conta em Mais para marcar como pago.</p>';
 var h='<button class="btn" style="font-size:17px;padding:16px;margin-top:10px" onclick="pagarRapido(\''+kind+'\',\''+id+'\',\''+(ym||'')+'\')">✓ '+(rotulo||'Paguei')+' '+c2s(resta)+' hoje</button><div class="sub" style="text-align:center;margin:-2px 0 6px">sai de '+esc(conta(c).nome)+(viv(S.contas).length>1?' · outra conta? use "Outro valor" abaixo':'')+'</div>';

function pagarRapido(kind,id,ym,fora,quieto){var c=contaPadrao();if(!c&&!fora){precisaConta();return}var t=hoje(),l,reabre,nome;
 if(kind==='fixa'){var x=fixaMes(fixa(id),ym);if(x.resta<=0)return;l={tipo:'pagfixa',ref:id+'|'+ym,valor:x.resta,data:fora?x.due:t};nome=fixa(id).nome;reabre=function(){abrirFixaMes(id,ym)}}
 else if(kind==='fatura'){var f=fatura(id,ym);if(f.resta<=0)return;l={tipo:'pagfatura',ref:id+'|'+ym,valor:f.resta,data:fora?f.vence:t};nome='Fatura '+f.nome;reabre=function(){abrirFatura(id,ym)}}
 else{var a=porId(S.avulsas,id),pg=soma(viv(S.lanc).filter(function(q){return q.ref===id&&(q.tipo==='pagavulsa'||q.tipo==='recavulsa')}),function(q){return q.valor}),rs=a.valor-pg;if(rs<=0)return;l={tipo:a.receber?'recavulsa':'pagavulsa',ref:id,valor:rs,data:fora?a.data:t};nome=a.desc;reabre=function(){abrirAvulsa(id)}}
 l.id=uid();l.meio=fora?'':c;if(fora)l.fora=true;l.criado=Date.now();l.at=Date.now();S.lanc.push(l);if(!fora)S.ultConta=c;if(quieto)return l.id;save();render();
 if(document.getElementById('ov').classList.contains('open'))reabre();
 toastDesf(nome+': '+(fora?'marcado como pago':c2s(l.valor)+' pago'),{lanc:[l.id],reabre:reabre})}

<script>
var PIX_CFG={sel:'input.money'};
/* ===================== VALOR EM REAIS IGUAL AO PIX DO BANCO (Hudson 30/10/2026) =====================
   Nos campos de dinheiro você só digita os números; os dois últimos viram os centavos e o ponto de milhar
   entra sozinho: 1 → 0,01 · 10018 → 100,18 · 150000 → 1.500,00. Apagar tira o último número.
   - Vírgula e ponto digitados por costume são ignorados ("50,00" continua dando 50,00).
   - Colar um valor ("R$ 1.234,56" ou "1234") entende o valor do jeito de sempre.
   - Ao tocar num campo que já tem valor, ele aparece completo (ex.: "120" vira "120,00") para continuar daí.
   - Onde existe valor negativo (desconto), o sinal de menos liga/desliga o negativo.
   Só muda a DIGITAÇÃO: o valor que o app guarda é o mesmo de antes. */
(function(){
 if(window._pixMoeda)return;window._pixMoeda=1;
 var CFG=window.PIX_CFG||{};var SEL=CFG.sel||'input[inputmode="decimal"]',NEG=CFG.neg||'';
 function eh(el){try{return !!el&&el.tagName==='INPUT'&&!el.readOnly&&!el.disabled&&el.type!=='date'&&el.matches(SEL)}catch(e){return false}}
 function podeNeg(el){try{return !!NEG&&el.matches(NEG)}catch(e){return false}}
 function fmt(dg){dg=String(dg).replace(/^0+/,'');while(dg.length<3)dg='0'+dg;var i=dg.slice(0,-2).replace(/\B(?=(\d{3})+(?!\d))/g,'.');return i+','+dg.slice(-2)}
 /* valor escrito do jeito antigo ("120", "1.700", "550.50", "R$ 1.234,56") -> centavos */
 function centavos(v){var s=String(v||'').replace(/R\$\s?/gi,'').replace(/\s/g,'').replace(/-/g,'');if(!/\d/.test(s))return null;
  if(s.indexOf(',')>=0)s=s.replace(/\./g,'').replace(',','.');else if(/^\d{1,3}(\.\d{3})+$/.test(s))s=s.replace(/\./g,'');
  var n=parseFloat(s.replace(/[^\d.]/g,''));return isFinite(n)?Math.round(n*100):null}
 function poe(el,nv){if(el.value===nv)return;el.value=nv;try{el.setSelectionRange(nv.length,nv.length)}catch(e){}}
 function normaliza(el){var v=el.value;if(!v||!/\d/.test(v))return;var c=centavos(v);if(c==null)return;var neg=podeNeg(el)&&/^\s*-/.test(v);poe(el,(neg?'-':'')+fmt(String(c)))}
 /* ao entrar no campo: mostra o valor completo (antes do app reagir ao foco) */
 document.addEventListener('focus',function(e){var el=e.target;if(eh(el))normaliza(el)},true);
 document.addEventListener('input',function(e){var el=e.target;if(!eh(el))return;var v=el.value,neg=podeNeg(el)&&((v.match(/-/g)||[]).length%2===1);
  if(e.inputType==='insertFromPaste'||e.inputType==='insertReplacementText'){var c=centavos(v);poe(el,c==null?'':(neg?'-':'')+fmt(String(c)));return}
  var dg=v.replace(/\D/g,'').replace(/^0+/,'');if(dg.length>11)dg=dg.slice(0,11);
  poe(el,dg?(neg?'-':'')+fmt(dg):(neg?'-':''))},true);
 /* teclado numérico nos campos de dinheiro que ainda abriam o teclado de letras */
 function teclado(r){try{[].forEach.call((r||document).querySelectorAll(SEL),function(el){if(!podeNeg(el)&&el.getAttribute('inputmode')!=='decimal')el.setAttribute('inputmode','decimal')})}catch(e){}}
 if(CFG.teclado){teclado();try{new MutationObserver(function(ms){for(var i=0;i<ms.length;i++)if(ms[i].addedNodes.length){teclado();return}}).observe(document.documentElement,{childList:true,subtree:true})}catch(e){}}
 window._pixFmt=fmt;window._pixCentavos=centavos;
})();

</script>
